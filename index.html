<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUBI FROTA - Gestão Inteligente</title>
    <!-- Bibliotecas Essenciais -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .glass-card { transition: all 0.3s ease; }
        .glass-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7N4C1lZperjJZiDlk_SPDEl4OlfvuvbjdePeWKa-qr2ojbu4kmL862ntMjjcZNPrPQQ/exec';

        // =======================================================
        // SISTEMA ANTI-CRASH
        // =======================================================
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null, errorInfo: null }; }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            componentDidCatch(error, errorInfo) { this.setState({ error: error, errorInfo: errorInfo }); console.error("Erro interno capturado:", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-slate-900 flex items-center justify-center p-6">
                            <div className="bg-white p-8 rounded-3xl max-w-2xl w-full shadow-2xl border-4 border-red-500">
                                <h2 className="text-2xl font-black text-red-600 mb-4">⚠️ Erro de Sistema (Crash Evitado)</h2>
                                <p className="text-slate-600 mb-4 text-sm font-bold">O aplicativo encontrou um dado corrompido. Limpe a memória do dispositivo clicando abaixo:</p>
                                <div className="bg-slate-100 p-4 rounded-xl overflow-x-auto text-[10px] font-mono text-slate-700 mb-6 border border-slate-300">
                                    <p className="font-bold text-red-500 mb-2">{this.state.error && this.state.error.toString()}</p>
                                </div>
                                <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="w-full bg-red-600 hover:bg-red-700 text-white font-black p-4 rounded-xl shadow-lg transition">🧹 Limpar Cache e Reiniciar</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // =======================================================
        // COMPONENTES DE UI PREMIUM
        // =======================================================
        const formatCurrency = (val) => isNaN(parseFloat(val)) ? 'R$ 0,00' : parseFloat(val).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        const KPICard = ({ icon, title, value, subtitle, colorClass }) => (
            <div className="bg-white rounded-2xl p-5 shadow-[0_2px_10px_-3px_rgba(6,81,237,0.1)] border border-slate-100 flex items-center gap-4 glass-card">
                <div className={`w-14 h-14 rounded-full flex items-center justify-center text-2xl shrink-0 ${colorClass}`}>{icon}</div>
                <div className="overflow-hidden">
                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 truncate">{title}</p>
                    <h3 className="text-2xl font-black text-slate-800 leading-none truncate">{value}</h3>
                    {subtitle && <p className="text-[10px] text-slate-500 mt-1 font-bold truncate">{subtitle}</p>}
                </div>
            </div>
        );

        const ChartWrapper = ({ type, data, options }) => {
            const canvasRef = useRef(null); const chartInstance = useRef(null);
            useEffect(() => {
                if (typeof window.Chart === 'undefined' || !data || !canvasRef.current) return;
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = canvasRef.current.getContext('2d');
                chartInstance.current = new window.Chart(ctx, { type, data, options: { ...options, maintainAspectRatio: false } });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [type, data, options]);
            if(!data) return null;
            return (
                <div className="relative w-full h-[250px] flex items-center justify-center mt-4">
                    {typeof window.Chart === 'undefined' && <span className="text-xs text-red-400">Erro: Gráficos indisponíveis.</span>}
                    <canvas ref={canvasRef}></canvas>
                </div>
            );
        };

        const DualBar = ({ title, label1, val1, color1, label2, val2, color2 }) => {
            const total = (parseFloat(val1) || 0) + (parseFloat(val2) || 0);
            if(total === 0) return null;
            const p1 = ((parseFloat(val1) || 0)/total)*100; const p2 = ((parseFloat(val2) || 0)/total)*100;
            return (
                <div className="bg-white p-6 rounded-2xl shadow-[0_2px_10px_-3px_rgba(6,81,237,0.1)] border border-slate-100 flex flex-col justify-center min-h-[160px] glass-card">
                    <h3 className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-5">{title}</h3>
                    <div className="flex w-full h-3 rounded-full overflow-hidden mb-4 bg-slate-100">
                        {val1 > 0 && <div style={{width: `${p1}%`, backgroundColor: color1}}></div>}
                        {val2 > 0 && <div style={{width: `${p2}%`, backgroundColor: color2}}></div>}
                    </div>
                    <div className="flex justify-between items-start">
                        <div className="flex flex-col"><span style={{color: color1}} className="text-[11px] font-bold uppercase">{label1} ({p1.toFixed(0)}%)</span><span className="text-slate-800 text-lg font-black mt-0.5">{formatCurrency(val1)}</span></div>
                        <div className="flex flex-col text-right"><span style={{color: color2}} className="text-[11px] font-bold uppercase">({p2.toFixed(0)}%) {label2}</span><span className="text-slate-800 text-lg font-black mt-0.5">{formatCurrency(val2)}</span></div>
                    </div>
                </div>
            );
        };

        const renderChartOrInsight = (dataObj, type, title, isForceTemporalChart = false, customOptions = {}) => {
            if(!dataObj || !dataObj.labels || dataObj.labels.length === 0) return null;
            
            // Dicionário de Inteligência de Negócio (BI) para cada gráfico
            const descricoesGraficos = {
                'Gastos por Categoria (Mês a Mês)': 'Apresenta a evolução financeira mensal da frota, segmentando os custos por categoria (combustível, manutenção, pneus, seguros, pedágios, multas, documentação, entre outros). Permite analisar tendências de gastos, identificar aumentos inesperados e apoiar decisões para redução de custos operacionais.', 
                'Aonde estamos gastando mais?': 'Apresenta a distribuição percentual dos custos da frota por categoria de despesa, como combustível, manutenção, pneus, seguros e pedágios. Permite identificar rapidamente quais áreas consomem a maior parcela do orçamento e onde existem maiores oportunidades de redução de custos.',
                'Ticket Médio de cada Despesa': 'Apresenta o custo médio das ocorrências registradas em cada categoria de gasto da frota. Esse indicador permite avaliar a eficiência dos processos, identificar serviços com custos acima do esperado e comparar a evolução dos valores médios ao longo do tempo.',
                'Média de KM por Destino': 'Apresenta a quilometragem média percorrida nas viagens realizadas para cada destino cadastrado, permitindo analisar padrões operacionais, planejar rotas mais eficientes e estimar custos logísticos com maior precisão.',
                'Alocação por Centro de Custo': 'Apresenta a distribuição dos gastos operacionais da frota entre os diferentes centros de custo da organização, possibilitando o acompanhamento detalhado dos investimentos e despesas por área, projeto, contrato ou unidade de negócio.',
                'Top 10 Custos por Viatura': 'Apresenta os veículos com maior custo operacional acumulado, considerando despesas como combustível, manutenção, pneus, multas, seguros, pedágios e demais gastos registrados. Esse indicador ajuda a identificar veículos com baixa eficiência econômica e alto custo de operação.',
                'Top 5 Fornecedores (Negociação)': 'Apresenta os cinco fornecedores com maior participação nas despesas da frota, considerando oficinas, postos de combustível, distribuidores de pneus, seguradoras e demais prestadores de serviço. Permite avaliar a concentração de gastos e apoiar estratégias de negociação e gestão de contratos.',
                'Evolução Mensal de Gastos (Cashburn)': 'Apresenta a variação mensal das despesas totais da frota, consolidando gastos com combustível, manutenção, pneus, seguros, pedágios, multas e demais custos operacionais. O indicador permite monitorar a tendência de consumo de recursos financeiros e avaliar a eficiência da gestão da frota.',
                'Evolução Mensal de Gastos': 'Apresenta a variação mensal dos custos associados a este veículo, incluindo despesas com combustível, manutenção, pneus, pedágios, multas, seguros e demais gastos operacionais. Permite identificar tendências de aumento de custos e avaliar a eficiência econômica da viatura.',
                'Evolução de Produtividade (KM Rodado)': 'Apresenta a evolução mensal da quilometragem percorrida pela frota, refletindo o grau de utilização operacional dos veículos. Este indicador auxilia na análise da produtividade, capacidade operacional e aproveitamento dos ativos da empresa.',
                'Custo por KM (R$/KM)': 'Apresenta a relação entre o total de despesas operacionais e a quilometragem percorrida, indicando o custo real de operação por quilômetro rodado. Este é um dos indicadores mais importantes para avaliar a eficiência financeira da frota.',
                'Histórico de Consumo (KM por Litro)': 'Apresenta a evolução do consumo de combustível a cada abastecimento, calculando a relação entre a distância percorrida e a quantidade de combustível utilizada. O indicador permite acompanhar a eficiência energética do veículo e identificar variações no consumo ao longo do tempo.',
                'Preço do Combustível Pago (R$/L)': 'Apresenta a evolução do valor médio pago por litro de combustível nos abastecimentos da frota. O indicador permite monitorar variações de preço entre períodos, regiões e fornecedores, auxiliando no controle de custos e na gestão de abastecimentos.'
            };
            
            const desc = descricoesGraficos[title] || '';

            if (!isForceTemporalChart && dataObj.labels.length === 1) {
                const singleValue = dataObj.datasets && dataObj.datasets[0] && dataObj.datasets[0].data ? dataObj.datasets[0].data[0] : 0;
                return (
                    <div className="bg-white p-6 rounded-2xl shadow-[0_2px_10px_-3px_rgba(6,81,237,0.1)] border border-slate-100 flex flex-col justify-between items-center text-center h-full min-h-[300px] glass-card">
                        <div className="flex-1 flex flex-col items-center justify-center">
                            <div className="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center text-3xl mb-4">💡</div>
                            <h3 className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">{title}</h3>
                            <p className="text-xl font-black text-slate-800 leading-tight px-2">{dataObj.labels[0]}</p>
                            <p className="text-2xl font-black text-blue-600 mt-2">{type === 'bar' && title.includes('KM') ? `${singleValue} km` : formatCurrency(singleValue)}</p>
                            <span className="bg-slate-50 text-slate-400 text-[10px] px-3 py-1 rounded-full mt-5 uppercase font-bold border border-slate-200">Dado único isolado</span>
                        </div>
                        {desc && <p className="text-[10px] text-slate-500 mt-4 pt-3 border-t border-slate-100 font-medium leading-relaxed text-left w-full whitespace-pre-wrap">{desc}</p>}
                    </div>
                );
            }
            let defaultOptions = { plugins: { legend: { display: false } }, elements: { point: { radius: 3, hoverRadius: 6 }, line: { borderWidth: 3 } } };
            if (type === 'doughnut') defaultOptions = { plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20, font: {family: 'Inter', size: 11} } } }, cutout: '70%' };
            if (type === 'line' || type === 'bar') defaultOptions.scales = { y: { beginAtZero: true, grid: { color: '#f1f5f9', drawBorder: false } }, x: { grid: { display: false, drawBorder: false } } };
            const mergedOptions = { ...defaultOptions, ...customOptions };
            
            return (
                <div className="bg-white p-6 rounded-2xl shadow-[0_2px_10px_-3px_rgba(6,81,237,0.1)] border border-slate-100 flex flex-col justify-between glass-card min-h-[300px]">
                    <div>
                        <h3 className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">{title}</h3>
                        <ChartWrapper type={type} data={dataObj} options={mergedOptions} />
                    </div>
                    {desc && <p className="text-[10px] text-slate-500 mt-4 pt-3 border-t border-slate-100 font-medium leading-relaxed whitespace-pre-wrap">{desc}</p>}
                </div>
            );
        };

        // =======================================================
        // APLICAÇÃO PRINCIPAL
        // =======================================================
        function ControleFrotaMulti() {
            // 1. ESTADOS BÁSICOS E MEMÓRIA DE EXCLUSÃO (NOVO)
            const [userRole, setUserRole] = useState(null); 
            const [veiculos, setVeiculos] = useState([]);
            const [veiculoAtivo, setVeiculoAtivo] = useState('TODOS'); 
            const [despesas, setDespesas] = useState([]);
            const [lembretes, setLembretes] = useState([]);
            const [rotas, setRotas] = useState([]);
            const [funcionarios, setFuncionarios] = useState([]);
            
            // Registo de itens eliminados localmente para não os ressuscitar na mesclagem
            const [deletedKeys, setDeletedKeys] = useState({ veiculos: [], despesas: [], rotas: [], lembretes: [], funcionarios: [] });
            
            const [view, setView] = useState('dashboard');
            const [showCadastro, setShowCadastro] = useState(false);
            const [showCadastroFunc, setShowCadastroFunc] = useState(false);
            
            const [isGenerating, setIsGenerating] = useState(false);
            const [formError, setFormError] = useState('');
            const [syncStatus, setSyncStatus] = useState('A conectar...');
            const [editingDespesaIndex, setEditingDespesaIndex] = useState(null);
            const [isUploading, setIsUploading] = useState(false);
            
            const [searchTerm, setSearchTerm] = useState('');
            const [filtroCatEvolucao, setFiltroCatEvolucao] = useState('TODAS');
            const [filtroMes, setFiltroMes] = useState('TODOS');

            const [novoVeiculo, setNovoVeiculo] = useState({ veiculo: '', placa: '', motorista: '', centroCusto: '', kmAtual: '' });
            const [editingVeicPlaca, setEditingVeicPlaca] = useState(null);
            
            const [novoFuncionario, setNovoFuncionario] = useState({ nome: '', cargo: 'Motorista' });
            const [editingFuncNome, setEditingFuncNome] = useState(null);

            const defaultDespesa = { categoria: 'Mecânica / Manutenção', data: new Date().toISOString().split('T')[0], valor: '', valorMaoObra: '', valorPecas: '', situacao: 'Concluída', km: '', fornecedor: '', nf: '', descricao: '', pecas: '', litros: '', precoLitro: '', tipoOS: 'Corretiva', localOS: 'Externa', anexos: [], rotaVinculada: '' };
            const [novaDespesa, setNovaDespesa] = useState(defaultDespesa);
            const [novoLembrete, setNovoLembrete] = useState({ tipo: 'Troca de Óleo e Filtro', freqKm: '', freqMeses: '', ultimoKm: '', ultimaData: new Date().toISOString().split('T')[0] });
            const [novaRotaGestor, setNovaRotaGestor] = useState({ origem: '', destino: '', observacoes: '' });
            const [execucaoRota, setExecucaoRota] = useState(null);

            // ==========================================
            // EFEITOS DE ARRANQUE E NUVEM
            // ==========================================
            const carregarDaNuvem = async () => {
                setSyncStatus('A puxar dados...');
                try {
                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'carregar' }) });
                    const result = await response.json();
                    if (result.status === 'sucesso') {
                        setVeiculos(result.dados.veiculos || []); setDespesas(result.dados.despesas || []); setLembretes(result.dados.lembretes || []);
                        setRotas(result.dados.rotas || []); setFuncionarios(result.dados.funcionarios || []);
                        setSyncStatus('Sincronizado'); localStorage.setItem('rubi_frota_db', JSON.stringify(result.dados));
                    }
                } catch (error) {
                    setSyncStatus('Modo Offline');
                    const saved = localStorage.getItem('rubi_frota_db');
                    if (saved) {
                        try {
                            const parsed = JSON.parse(saved);
                            setVeiculos(Array.isArray(parsed.veiculos) ? parsed.veiculos : []); setDespesas(Array.isArray(parsed.despesas) ? parsed.despesas : []);
                            setLembretes(Array.isArray(parsed.lembretes) ? parsed.lembretes : []); setRotas(Array.isArray(parsed.rotas) ? parsed.rotas : []);
                            setFuncionarios(Array.isArray(parsed.funcionarios) ? parsed.funcionarios : []);
                        } catch(e){}
                    }
                }
            };

            useEffect(() => {
                const savedRole = localStorage.getItem('rubi_frota_role');
                if (savedRole) { setUserRole(savedRole); if (savedRole === 'OPERACIONAL') setView('rotas'); }
                carregarDaNuvem();
            }, []);

            useEffect(() => {
                if ((view === 'os' || view === 'abastecimento' || view === 'despesaGeral') && editingDespesaIndex === null && veiculoAtivo !== 'TODOS') {
                    const rascunhoStr = localStorage.getItem('rubi_frota_rascunho_despesa');
                    if (rascunhoStr) { try { const parsed = JSON.parse(rascunhoStr); if (parsed.view === view && parsed.veiculo === veiculoAtivo) setNovaDespesa(parsed.despesa); } catch(e){} }
                }
            }, [view, veiculoAtivo, editingDespesaIndex]);

            // ==========================================
            // VARIÁVEIS BASE PARA FILTRAGEM
            // ==========================================
            const isGlobal = veiculoAtivo === 'TODOS';
            const veiculoAtual = isGlobal ? null : veiculos.find(v => v.placa === veiculoAtivo);
            const kmAtualNum = veiculoAtual ? parseFloat(veiculoAtual.kmAtual) || 0 : 0;
            const motoristaVeiculo = veiculoAtual ? veiculoAtual.motorista : 'N/I';
            const ccVeiculo = veiculoAtual ? veiculoAtual.centroCusto : 'N/I';
            
            const mesesDisponiveis = useMemo(() => {
                const meses = new Set();
                despesas.forEach(d => { if(d.data && typeof d.data === 'string' && d.data.includes('-')) meses.add(d.data.substring(0, 7)); });
                return Array.from(meses).sort().reverse();
            }, [despesas]);

            const despesasIniciais = useMemo(() => {
                let d = isGlobal ? despesas.slice().reverse() : despesas.filter(x => x.placa === veiculoAtivo).reverse();
                if (filtroMes !== 'TODOS') { d = d.filter(x => x.data && x.data.startsWith(filtroMes)); }
                return d;
            }, [despesas, veiculoAtivo, isGlobal, filtroMes]);
            
            const rotasDashboard = useMemo(() => {
                let r = isGlobal ? rotas : rotas.filter(x => x.placa === veiculoAtivo);
                if (filtroMes !== 'TODOS') {
                    r = r.filter(x => {
                        const dataBruta = String(x.dataInicial || x.data || "");
                        if (!dataBruta) return false;
                        const parteData = dataBruta.split(' ')[0];
                        if (parteData.includes('/')) {
                            const p = parteData.split('/');
                            if (p.length === 3) return `${p[2].length === 2 ? `20${p[2]}` : p[2]}-${p[1]}` === filtroMes;
                        } else if (parteData.includes('-')) return parteData.startsWith(filtroMes);
                        return false;
                    });
                }
                return r;
            }, [rotas, veiculoAtivo, isGlobal, filtroMes]);

            const rotasParaVincular = useMemo(() => isGlobal ? (novaDespesa.placa ? rotas.filter(r => r.placa === novaDespesa.placa).reverse().slice(0, 20) : []) : rotas.filter(r => r.placa === veiculoAtivo).reverse().slice(0, 20), [rotas, veiculoAtivo, isGlobal, novaDespesa.placa]);

            const getKmAtual = (placa) => { const v = veiculos.find(ve => ve.placa === placa); return v ? parseFloat(v.kmAtual) || 0 : 0; };
            const getNomeRota = (rotaId) => {
                const r = rotas.find(rt => String(rt.id) === String(rotaId));
                return r ? (r.status === 'Pendente' ? `⏳ ${r.origem} ➔ ${r.destino}` : `${r.id} (${r.origem} ➔ ${r.destino})`) : `Rota ${rotaId}`;
            };

            const checkStatusLembrete = (lembrete) => {
                const kmDoVeiculoAlvo = getKmAtual(lembrete.placa);
                let status = { cor: 'bg-green-50 text-green-700', icone: '✅', msg: 'No Prazo', critico: false };
                if (lembrete.freqKm) {
                    const limiteKm = parseFloat(lembrete.ultimoKm) + parseFloat(lembrete.freqKm);
                    if (kmDoVeiculoAlvo >= limiteKm) return { cor: 'bg-red-50 text-red-700', icone: '🚨', msg: 'Vencido (KM)', critico: true };
                    else if (limiteKm - kmDoVeiculoAlvo <= 1000) status = { cor: 'bg-amber-50 text-amber-700', icone: '⚠️', msg: 'Atenção: KM Próximo', critico: false };
                }
                if (lembrete.freqMeses && !status.critico) {
                    const dataLimite = new Date(lembrete.ultimaData);
                    dataLimite.setMonth(dataLimite.getMonth() + parseInt(lembrete.freqMeses));
                    const hoje = new Date();
                    if (hoje >= dataLimite) return { cor: 'bg-red-50 text-red-700', icone: '🚨', msg: 'Vencido (Prazo)', critico: true };
                    else {
                        const diffDias = (dataLimite - hoje) / (1000 * 60 * 60 * 24);
                        if (diffDias <= 15) status = { cor: 'bg-amber-50 text-amber-700', icone: '📅', msg: 'Atenção: Prazo Próximo', critico: false };
                    }
                }
                return status;
            };

            const checkSaudeVeiculo = (placa) => {
                const lembretesDoVeiculo = lembretes.filter(l => l.placa === placa);
                if (lembretesDoVeiculo.length === 0) return 'OK';
                let temCritico = false; let temAviso = false;
                lembretesDoVeiculo.forEach(l => { const st = checkStatusLembrete(l); if (st.critico) temCritico = true; if (st.icone === '⚠️' || st.icone === '📅') temAviso = true; });
                if (temCritico) return 'CRITICO';
                if (temAviso) return 'AVISO';
                return 'OK';
            };

            // ==========================================
            // 3. CÁLCULOS DE BUSINESS INTELLIGENCE (BI)
            // ==========================================

                    if (cloud.status === 'sucesso' && cloud.dados) {
                        // Função inteligente que funde os arrays e protege itens apagados pelo utilizador atual
                        const mergeSeguro = (local, nuvem, chave, tipoDel) => {
                            const localKeys = new Set(local.map(i => String(i[chave])));
                            const deletados = new Set(dKeys[tipoDel].map(String));
                            const faltantesDaNuvem = (nuvem || []).filter(i => !localKeys.has(String(i[chave])) && !deletados.has(String(i[chave])));

                            const localKeys = new Set(local.map(hashD));
                            const deletados = new Set(dKeys.despesas.map(String));
                            const faltantesDaNuvem = (nuvem || []).filter(d => !localKeys.has(hashD(d)) && !deletados.has(hashD(d)));
                            return [...local, ...faltantesDaNuvem];

                        finalRots = mergeSeguro(rots, cloud.dados.rotas, 'id', 'rotas');
                        finalLembs = mergeSeguro(lembs, cloud.dados.lembretes, 'id', 'lembretes');
                        finalFuncs = mergeSeguro(funcs, cloud.dados.funcionarios, 'nome', 'funcionarios');

                    } else { setSyncStatus('Erro Sync'); }
                } catch (error) {

                                    </button>
                                    <button onClick={() => { setView('despesaGeral'); setNovaDespesa({...defaultDespesa, categoria: 'Pedágio'}); }} className={`flex-1 flex flex-col items-center justify-center p-3 rounded-xl transition-colors ${view === 'despesaGeral' ? 'text-emerald-700 bg-emerald-50' : 'text-slate-400 hover:bg-slate-50'}`}>
                                        <span className="text-2xl mb-1">💸</span><span className="text-[10px] font-black uppercase tracking-wider">Despesas</span>
                                    </button>
                                    <button onClick={() => { setView('os'); setNovaDespesa({...defaultDespesa, categoria: 'Mecânica / Manutenção'}); }} className={`flex-1 flex flex-col items-center justify-center p-3 rounded-xl transition-colors ${view === 'os' ? 'text-blue-700 bg-blue-50' : 'text-slate-400 hover:bg-slate-50'}`}>
                                        <span className="text-2xl mb-1">🔧</span><span className="text-[10px] font-black uppercase tracking-wider">O.S.</span>
                                    </button>
                                </>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <ControleFrotaMulti />
            </ErrorBoundary>
        );
    </script>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }
    </script>
</body>
</html>
