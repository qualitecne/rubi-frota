<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUBI FROTA - Gestão Inteligente</title>
    <!-- Bibliotecas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Biblioteca de Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    
    <style>
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease forwards; }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // COMPONENTE DE GRÁFICO (CHART.JS)
        function ChartComponent({ type, data, options, height = '250px' }) {
            const canvasRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }
                const ctx = canvasRef.current.getContext('2d');
                chartInstance.current = new window.Chart(ctx, { type, data, options });
                
                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [data, type, options]);

            return (
                <div style={{ height, width: '100%', position: 'relative' }}>
                    <canvas ref={canvasRef}></canvas>
                </div>
            );
        }

        // URL DA SUA API GOOGLE SHEETS
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7N4C1lZperjJZiDlk_SPDEl4OlfvuvbjdePeWKa-qr2ojbu4kmL862ntMjjcZNPrPQQ/exec';

        function ControleFrotaMulti() {
            // ESTADOS DA APLICAÇÃO
            const [userRole, setUserRole] = useState(null); 
            const [veiculos, setVeiculos] = useState([]);
            const [veiculoAtivo, setVeiculoAtivo] = useState('TODOS'); 
            const [despesas, setDespesas] = useState([]);
            const [lembretes, setLembretes] = useState([]);
            const [rotas, setRotas] = useState([]);
            
            const [view, setView] = useState('dashboard');
            const [showCadastro, setShowCadastro] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [formError, setFormError] = useState('');
            const [syncStatus, setSyncStatus] = useState('☁️ A conectar...');
            const [editingDespesaIndex, setEditingDespesaIndex] = useState(null);
            
            const [isUploading, setIsUploading] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');

            const [novoVeiculo, setNovoVeiculo] = useState({ veiculo: '', placa: '', motorista: '', centroCusto: '', kmAtual: '' });

            const defaultDespesa = {
                categoria: 'Mecânica / Manutenção', data: new Date().toISOString().split('T')[0], 
                valor: '', valorMaoObra: '', valorPecas: '', situacao: 'Concluída',
                km: '', fornecedor: '', nf: '', descricao: '', pecas: '',
                litros: '', precoLitro: '',
                tipoOS: 'Corretiva', localOS: 'Externa', anexos: []
            };

            const [novaDespesa, setNovaDespesa] = useState(defaultDespesa);

            const [novoLembrete, setNovoLembrete] = useState({
                tipo: 'Troca de Óleo e Filtro', freqKm: '', freqMeses: '', ultimoKm: '', ultimaData: new Date().toISOString().split('T')[0]
            });

            const [novaRotaGestor, setNovaRotaGestor] = useState({ origem: '', destino: '', observacoes: '' });
            const [execucaoRota, setExecucaoRota] = useState(null);

            // CARREGAMENTO INICIAL
            useEffect(() => {
                const savedRole = localStorage.getItem('rubi_frota_role');
                if (savedRole) {
                    setUserRole(savedRole);
                    if (savedRole === 'OPERACIONAL') setView('rotas');
                }
                carregarDaNuvem();
            }, []);

            // VERIFICAÇÃO DE RASCUNHOS
            useEffect(() => {
                if ((view === 'os' || view === 'abastecimento') && editingDespesaIndex === null && veiculoAtivo !== 'TODOS') {
                    const rascunhoStr = localStorage.getItem('rubi_frota_rascunho_despesa');
                    if (rascunhoStr) {
                        const parsed = JSON.parse(rascunhoStr);
                        if (parsed.view === view && parsed.veiculo === veiculoAtivo) setNovaDespesa(parsed.despesa);
                    }
                }
            }, [view, veiculoAtivo, editingDespesaIndex]);

            // FUNÇÕES DE NUVEM E BACKUP
            const carregarDaNuvem = async () => {
                setSyncStatus('⏳ A puxar...');
                try {
                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'carregar' }) });
                    const result = await response.json();
                    if (result.status === 'sucesso') {
                        if (result.dados.veiculos) setVeiculos(result.dados.veiculos);
                        if (result.dados.despesas) setDespesas(result.dados.despesas);
                        if (result.dados.lembretes) setLembretes(result.dados.lembretes);
                        if (result.dados.rotas) setRotas(result.dados.rotas);
                        setSyncStatus('☁️ OK');
                        localStorage.setItem('rubi_frota_db', JSON.stringify(result.dados));
                    }
                } catch (error) {
                    setSyncStatus('⚠️ Offline');
                    const saved = localStorage.getItem('rubi_frota_db');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed.veiculos) setVeiculos(parsed.veiculos);
                        if (parsed.despesas) setDespesas(parsed.despesas);
                        if (parsed.lembretes) setLembretes(parsed.lembretes);
                        if (parsed.rotas) setRotas(parsed.rotas);
                    }
                }
            };

            const salvarNaNuvem = async (veics, desps, lembs, rots) => {
                setSyncStatus('⏳ A guardar...');
                localStorage.setItem('rubi_frota_db', JSON.stringify({ veiculos: veics, despesas: desps, lembretes: lembs, rotas: rots }));
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'sincronizar', veiculos: veics, despesas: desps, lembretes: lembs, rotas: rots })
                    });
                    const result = await response.json();
                    if (result.status === 'sucesso') setSyncStatus('☁️ OK');
                    else setSyncStatus('⚠️ Erro Sync');
                } catch (error) {
                    setSyncStatus('⚠️ Offline');
                }
            };

            const exportarBackup = () => {
                const dados = { veiculos, despesas, lembretes, rotas };
                const blob = new Blob([JSON.stringify(dados)], {type: "application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Backup_RUBI_FROTA_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            };

            const importarBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.veiculos) setVeiculos(parsed.veiculos);
                        if (parsed.despesas) setDespesas(parsed.despesas);
                        if (parsed.lembretes) setLembretes(parsed.lembretes);
                        if (parsed.rotas) setRotas(parsed.rotas);
                        salvarNaNuvem(parsed.veiculos || [], parsed.despesas || [], parsed.lembretes || [], parsed.rotas || []);
                        alert("✅ Backup restaurado com sucesso!");
                    } catch(err) {
                        alert("❌ Arquivo de backup inválido!");
                    }
                };
                reader.readAsText(file);
            };

            // ECRÃ DE LOGIN
            if (!userRole) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 p-6 animate-fade-in">
                        <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>
                            <h1 className="text-4xl font-black tracking-tight text-blue-600 mb-1 mt-4">RUBI<span className="text-slate-800 font-light">FROTA</span></h1>
                            <p className="text-slate-500 text-sm mb-10">Selecione o seu perfil de acesso</p>
                            <div className="space-y-4">
                                <button onClick={() => {
                                    const pin = prompt("Digite a senha do Gestor (A senha padrão é 1234):");
                                    if (pin === '1234') { setUserRole('GESTOR'); localStorage.setItem('rubi_frota_role', 'GESTOR'); setView('dashboard'); } 
                                    else if (pin !== null) alert('Senha incorreta!');
                                }} className="w-full bg-slate-800 text-white font-bold p-4 rounded-2xl hover:bg-slate-900 transition flex items-center justify-center gap-3 shadow-md">
                                    <span className="text-2xl">👔</span> <span>Acesso Gestor</span>
                                </button>
                                <button onClick={() => {
                                    setUserRole('OPERACIONAL'); localStorage.setItem('rubi_frota_role', 'OPERACIONAL'); setView('rotas');
                                }} className="w-full bg-blue-50 text-blue-700 font-bold p-4 rounded-2xl border border-blue-200 hover:bg-blue-100 transition flex items-center justify-center gap-3">
                                    <span className="text-2xl">🚛</span> <span>Acesso Operacional</span>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // VARIÁVEIS COMPUTADAS E FILTROS
            const isGlobal = veiculoAtivo === 'TODOS';
            const veiculoAtual = isGlobal ? null : veiculos.find(v => v.placa === veiculoAtivo);
            const kmAtualNum = veiculoAtual ? parseFloat(veiculoAtual.kmAtual) || 0 : 0;
            
            const despesasIniciais = isGlobal ? despesas.slice().reverse() : despesas.filter(d => d.placa === veiculoAtivo).reverse();
            
            const despesasFiltradas = despesasIniciais.filter(d => 
                (d.categoria && d.categoria.toLowerCase().includes(searchTerm.toLowerCase())) || 
                (d.fornecedor && d.fornecedor.toLowerCase().includes(searchTerm.toLowerCase())) ||
                (d.descricao && d.descricao.toLowerCase().includes(searchTerm.toLowerCase())) ||
                (d.placa && d.placa.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            const lembretesFiltrados = isGlobal ? lembretes : lembretes.filter(l => l.placa === veiculoAtivo);
            const rotasFiltradas = isGlobal ? rotas.slice().reverse() : rotas.filter(r => r.placa === veiculoAtivo).reverse();
            const totalGasto = despesasIniciais.reduce((acc, curr) => acc + (parseFloat(curr.valor) || 0), 0);

            const formatCurrency = (val) => isNaN(parseFloat(val)) ? 'R$ 0,00' : parseFloat(val).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            const getKmAtual = (placa) => {
                const v = veiculos.find(ve => ve.placa === placa);
                return v ? parseFloat(v.kmAtual) || 0 : 0;
            };

            const atualizarKmVeiculo = (novoKmInformado, placaVeiculo) => {
                const novoKm = parseFloat(novoKmInformado);
                const veiculoAlvo = veiculos.find(v => v.placa === placaVeiculo);
                if (veiculoAlvo && novoKm > (parseFloat(veiculoAlvo.kmAtual) || 0)) {
                    return veiculos.map(v => v.placa === placaVeiculo ? { ...v, kmAtual: novoKm } : v);
                }
                return veiculos;
            };

            // DADOS PARA GRÁFICOS
            const getChartOptions = (isPie = false) => ({
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: isPie ? 'right' : 'top', labels: { boxWidth: 12, font: { size: 10 } } }
                }
            });

            // 1. Gráfico Global: Categorias
            const catMap = {};
            despesasIniciais.forEach(d => { catMap[d.categoria] = (catMap[d.categoria] || 0) + (parseFloat(d.valor) || 0); });
            const dataChartCategorias = {
                labels: Object.keys(catMap),
                datasets: [{ data: Object.values(catMap), backgroundColor: ['#3b82f6', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6', '#64748b'] }]
            };

            // 2. Gráfico Global: Evolução Mensal
            const mesMap = {};
            despesasIniciais.forEach(d => {
                if(!d.data) return;
                const mes = d.data.substring(0, 7);
                mesMap[mes] = (mesMap[mes] || 0) + (parseFloat(d.valor) || 0);
            });
            const labelsMes = Object.keys(mesMap).sort();
            const dataChartMensal = {
                labels: labelsMes.map(m => { const [y, mm] = m.split('-'); return `${mm}/${y.substring(2)}`; }),
                datasets: [{ label: 'Gastos Totais (R$)', data: labelsMes.map(m => mesMap[m]), backgroundColor: '#3b82f6', borderRadius: 4 }]
            };

            // 3. Gráfico Global: Ranking Viaturas
            const viatMap = {};
            despesasIniciais.forEach(d => { viatMap[d.placa] = (viatMap[d.placa] || 0) + (parseFloat(d.valor) || 0); });
            const viatSorted = Object.keys(viatMap).sort((a,b) => viatMap[b] - viatMap[a]); // Ordem Decrescente
            const dataChartViaturas = {
                labels: viatSorted,
                datasets: [{ label: 'Custo por Viatura (R$)', data: viatSorted.map(v => viatMap[v]), backgroundColor: '#f59e0b', borderRadius: 4 }]
            };

            // 4. Gráfico Individual: MO vs Peças
            let totalMO = 0; let totalPecas = 0;
            despesasIniciais.forEach(d => {
                totalMO += parseFloat(d.valorMaoObra) || 0;
                totalPecas += parseFloat(d.valorPecas) || 0;
            });
            const dataChartMO = {
                labels: ['Mão de Obra', 'Peças'],
                datasets: [{ data: [totalMO, totalPecas], backgroundColor: ['#3b82f6', '#10b981'] }]
            };

            // 5. Gráfico Individual: Consumo KM/L
            const abastecimentosParaConsumo = despesasIniciais
                .filter(d => d.categoria === 'Abastecimento' && d.km && (d.descricao && d.descricao.includes('L a R$')))
                .sort((a,b) => parseFloat(a.km) - parseFloat(b.km));
            
            const kmlLabels = [];
            const kmlData = [];
            for (let i = 1; i < abastecimentosParaConsumo.length; i++) {
                const kmDiff = parseFloat(abastecimentosParaConsumo[i].km) - parseFloat(abastecimentosParaConsumo[i-1].km);
                // Extrai os litros da descrição [XXL a R$YY/L]
                const litrosMatch = abastecimentosParaConsumo[i].descricao.match(/\[([\d.]+)L/);
                if (litrosMatch && kmDiff > 0) {
                    const litros = parseFloat(litrosMatch[1]);
                    if (litros > 0) {
                        kmlLabels.push(abastecimentosParaConsumo[i].data.substring(5)); // Mês/Dia
                        kmlData.push((kmDiff / litros).toFixed(2));
                    }
                }
            }
            const dataChartKML = {
                labels: kmlLabels,
                datasets: [{ label: 'Média KM/L', data: kmlData, borderColor: '#10b981', backgroundColor: '#10b981', tension: 0.3, fill: false }]
            };


            // FUNÇÕES DE AÇÃO PRINCIPAIS
            const handleAddVeiculo = () => {
                if (!novoVeiculo.veiculo || !novoVeiculo.placa) return alert('Veículo e Matrícula/Placa são obrigatórios!');
                const placaUpper = novoVeiculo.placa.toUpperCase();
                if (veiculos.find(v => v.placa === placaUpper)) return alert('Matrícula já registada!');
                const novosVeiculos = [...veiculos, { ...novoVeiculo, placa: placaUpper }];
                setVeiculos(novosVeiculos);
                salvarNaNuvem(novosVeiculos, despesas, lembretes, rotas);
                setVeiculoAtivo(placaUpper);
                setNovoVeiculo({ veiculo: '', placa: '', motorista: '', centroCusto: '', kmAtual: '' });
                setShowCadastro(false);
                setView('dashboard');
            };

            const removerVeiculo = () => {
                if(confirm("ATENÇÃO: Deseja excluir esta viatura permanentemente?")) {
                    const novosVeiculos = veiculos.filter(v => v.placa !== veiculoAtivo);
                    setVeiculos(novosVeiculos);
                    salvarNaNuvem(novosVeiculos, despesas, lembretes, rotas);
                    setVeiculoAtivo('TODOS');
                    setView('dashboard');
                }
            };

            const handleSalvarRascunhoDespesa = () => {
                localStorage.setItem('rubi_frota_rascunho_despesa', JSON.stringify({ view: view, veiculo: veiculoAtivo, despesa: novaDespesa }));
                alert('💾 Rascunho salvo com sucesso!');
            };

            const handleAddDespesa = () => {
                if (isGlobal) return alert('Selecione uma viatura específica.');
                let valorFinal = novaDespesa.valor;
                
                let descricaoFinal = novaDespesa.descricao;
                if (view === 'abastecimento') {
                    if (novaDespesa.litros && novaDespesa.precoLitro) {
                        const resumo = `[${novaDespesa.litros}L a R$${novaDespesa.precoLitro}/L]`;
                        descricaoFinal = descricaoFinal ? `${resumo} ${descricaoFinal}` : resumo;
                    }
                }

                if (view === 'os') {
                    const totalOS = (parseFloat(novaDespesa.valorMaoObra) || 0) + (parseFloat(novaDespesa.valorPecas) || 0);
                    if (totalOS <= 0 && novaDespesa.situacao === 'Concluída' && userRole === 'GESTOR') return setFormError('Informe os valores para O.S. Concluída.');
                    valorFinal = totalOS > 0 ? totalOS.toFixed(2) : '0.00';
                }
                
                if (!novaDespesa.data) return setFormError('A data é obrigatória.');
                setFormError('');

                let novosVeiculos = veiculos;
                if (novaDespesa.km) {
                    novosVeiculos = atualizarKmVeiculo(novaDespesa.km, veiculoAtivo);
                    setVeiculos(novosVeiculos);
                }

                let novasDespesas = [...despesas];
                const registoPronto = { ...novaDespesa, valor: valorFinal, descricao: descricaoFinal, placa: veiculoAtivo };
                
                if (editingDespesaIndex !== null) {
                    novasDespesas[editingDespesaIndex] = registoPronto;
                    alert('✅ Registo atualizado!');
                } else {
                    novasDespesas = [...despesas, registoPronto];
                    alert('✅ Registo guardado com sucesso!');
                }

                setDespesas(novasDespesas);
                salvarNaNuvem(novosVeiculos, novasDespesas, lembretes, rotas);
                localStorage.removeItem('rubi_frota_rascunho_despesa');
                setEditingDespesaIndex(null);
                setNovaDespesa(defaultDespesa);
                if(userRole === 'GESTOR') setView('historico');
            };

            const handleEditDespesa = (despesa) => {
                const indexReal = despesas.indexOf(despesa);
                setEditingDespesaIndex(indexReal);
                setNovaDespesa(despesa);
                setView(despesa.categoria === 'Abastecimento' ? 'abastecimento' : 'os');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const removerDespesa = (despesa) => {
                if(confirm("Deseja eliminar este registo?")) {
                    const novasDespesas = despesas.filter(d => d !== despesa);
                    setDespesas(novasDespesas);
                    salvarNaNuvem(veiculos, novasDespesas, lembretes, rotas);
                }
            };

            // UPLOAD PARA O GOOGLE DRIVE
            const handleImageUpload = async (e) => {
                const arquivos = Array.from(e.target.files);
                if (arquivos.length === 0) return;
                setIsUploading(true);
                setFormError('');

                const uploadPromises = arquivos.map(file => {
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = event => {
                            const isPDF = file.type === 'application/pdf';
                            
                            if (isPDF) {
                                const base64Data = event.target.result;
                                fetch(SCRIPT_URL, {
                                    method: 'POST',
                                    body: JSON.stringify({ action: 'upload_imagem', base64: base64Data, nomeArquivo: `DOC_${Date.now()}.pdf`, mimeType: 'application/pdf' })
                                }).then(res => res.json()).then(result => {
                                    if (result.status === 'sucesso') resolve(result.url); else reject();
                                }).catch(() => reject());
                            } else {
                                const img = new Image();
                                img.onload = async () => {
                                    const canvas = document.createElement('canvas');
                                    const ctx = canvas.getContext('2d');
                                    let w = img.width, h = img.height;
                                    if (w > 1200) { h *= 1200 / w; w = 1200; }
                                    canvas.width = w; canvas.height = h;
                                    ctx.drawImage(img, 0, 0, w, h);
                                    const base64Data = canvas.toDataURL('image/jpeg', 0.7);
                                    fetch(SCRIPT_URL, {
                                        method: 'POST',
                                        body: JSON.stringify({ action: 'upload_imagem', base64: base64Data, nomeArquivo: `FOTO_${Date.now()}.jpg`, mimeType: 'image/jpeg' })
                                    }).then(res => res.json()).then(result => {
                                        if (result.status === 'sucesso') resolve(result.url); else reject();
                                    }).catch(() => reject());
                                };
                                img.src = event.target.result;
                            }
                        };
                        reader.readAsDataURL(file);
                    });
                });

                try {
                    const uploadedUrls = await Promise.all(uploadPromises);
                    setNovaDespesa(prev => ({ ...prev, anexos: [...(prev.anexos || []), ...uploadedUrls] }));
                } catch (err) {
                    setFormError('Erro ao carregar ficheiro. Tente novamente.');
                } finally {
                    setIsUploading(false);
                }
            };

            const handleAddLembrete = () => {
                if (isGlobal) return alert('Selecione uma viatura específica.');
                if (!novoLembrete.freqKm && !novoLembrete.freqMeses) return alert('Indique a frequência em KM ou Meses.');
                const novosLembretes = [...lembretes, { ...novoLembrete, id: Date.now(), placa: veiculoAtivo }];
                setLembretes(novosLembretes);
                salvarNaNuvem(veiculos, despesas, novosLembretes, rotas);
                setNovoLembrete({ tipo: 'Troca de Óleo e Filtro', freqKm: '', freqMeses: '', ultimoKm: kmAtualNum || '', ultimaData: new Date().toISOString().split('T')[0] });
            };

            const removerLembrete = (id) => {
                if(confirm("Eliminar alerta?")) {
                    const novosLembretes = lembretes.filter(l => l.id !== id);
                    setLembretes(novosLembretes);
                    salvarNaNuvem(veiculos, despesas, novosLembretes, rotas);
                }
            };

            const handleCriarRota = () => {
                if(isGlobal) return alert('Selecione uma viatura para delegar a rota.');
