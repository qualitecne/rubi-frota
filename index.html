<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUBI FROTA - Gestão Inteligente</title>
    <!-- Bibliotecas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    
    <style>
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // URL DA SUA API GOOGLE SHEETS
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7N4C1lZperjJZiDlk_SPDEl4OlfvuvbjdePeWKa-qr2ojbu4kmL862ntMjjcZNPrPQQ/exec';

        function ControleFrotaMulti() {
            // ESTADOS DA APLICAÇÃO
            const [userRole, setUserRole] = useState(null); 
            const [veiculos, setVeiculos] = useState([]);
            const [veiculoAtivo, setVeiculoAtivo] = useState('TODOS'); 
            const [despesas, setDespesas] = useState([]);
            const [lembretes, setLembretes] = useState([]);
            const [rotas, setRotas] = useState([]);
            
            const [view, setView] = useState('dashboard');
            const [showCadastro, setShowCadastro] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [formError, setFormError] = useState('');
            const [syncStatus, setSyncStatus] = useState('☁️ A conectar...');
            const [editingDespesaIndex, setEditingDespesaIndex] = useState(null);

            const [novoVeiculo, setNovoVeiculo] = useState({ veiculo: '', placa: '', motorista: '', centroCusto: '', kmAtual: '' });

            const defaultDespesa = {
                categoria: 'Mecânica / Manutenção', data: new Date().toISOString().split('T')[0], 
                valor: '', valorMaoObra: '', valorPecas: '', situacao: 'Concluída',
                km: '', fornecedor: '', nf: '', descricao: '', pecas: '',
                tipoOS: 'Corretiva', localOS: 'Externa', kmPercorrido: '', consumoKmLitro: '', precoCombustivel: '', anexos: []
            };

            const [novaDespesa, setNovaDespesa] = useState(defaultDespesa);

            const [novoLembrete, setNovoLembrete] = useState({
                tipo: 'Troca de Óleo e Filtro', freqKm: '', freqMeses: '', ultimoKm: '', ultimaData: new Date().toISOString().split('T')[0]
            });

            const [novaRotaGestor, setNovaRotaGestor] = useState({ origem: '', destino: '', observacoes: '' });
            const [execucaoRota, setExecucaoRota] = useState(null);

            // CARREGAMENTO INICIAL
            useEffect(() => {
                const savedRole = localStorage.getItem('rubi_frota_role');
                if (savedRole) {
                    setUserRole(savedRole);
                    if (savedRole === 'OPERACIONAL') setView('rotas');
                }
                carregarDaNuvem();
            }, []);

            // FUNÇÕES DE NUVEM
            const carregarDaNuvem = async () => {
                setSyncStatus('⏳ A puxar dados...');
                try {
                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'carregar' }) });
                    const result = await response.json();
                    
                    if (result.status === 'sucesso') {
                        if (result.dados.veiculos) setVeiculos(result.dados.veiculos);
                        if (result.dados.despesas) setDespesas(result.dados.despesas);
                        if (result.dados.lembretes) setLembretes(result.dados.lembretes);
                        if (result.dados.rotas) setRotas(result.dados.rotas);
                        setSyncStatus('☁️ OK');
                        localStorage.setItem('rubi_frota_db', JSON.stringify(result.dados));
                    }
                } catch (error) {
                    setSyncStatus('⚠️ Offline');
                    const saved = localStorage.getItem('rubi_frota_db');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed.veiculos) setVeiculos(parsed.veiculos);
                        if (parsed.despesas) setDespesas(parsed.despesas);
                        if (parsed.lembretes) setLembretes(parsed.lembretes);
                        if (parsed.rotas) setRotas(parsed.rotas);
                    }
                }
            };

            const salvarNaNuvem = async (veics, desps, lembs, rots) => {
                setSyncStatus('⏳ A guardar...');
                localStorage.setItem('rubi_frota_db', JSON.stringify({ veiculos: veics, despesas: desps, lembretes: lembs, rotas: rots }));
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'sincronizar', veiculos: veics, despesas: desps, lembretes: lembs, rotas: rots })
                    });
                    const result = await response.json();
                    if (result.status === 'sucesso') setSyncStatus('☁️ OK');
                    else setSyncStatus('⚠️ Erro Sync');
                } catch (error) {
                    setSyncStatus('⚠️ Offline');
                }
            };

            const handleLogout = () => {
                if(confirm("Deseja sair da sua conta atual?")) {
                    setUserRole(null);
                    localStorage.removeItem('rubi_frota_role');
                    setView('dashboard');
                }
            };

            // ECRÃ DE LOGIN
            if (!userRole) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 p-6 animate-fade-in">
                        <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>
                            <h1 className="text-4xl font-black tracking-tight text-blue-600 mb-1 mt-4">RUBI<span className="text-slate-800 font-light">FROTA</span></h1>
                            <p className="text-slate-500 text-sm mb-10">Selecione o seu perfil de acesso</p>
                            <div className="space-y-4">
                                <button onClick={() => {
                                    const pin = prompt("Digite a senha do Gestor (A senha padrão é 1234):");
                                    if (pin === '1234') { setUserRole('GESTOR'); localStorage.setItem('rubi_frota_role', 'GESTOR'); setView('dashboard'); } 
                                    else if (pin !== null) alert('Senha incorreta!');
                                }} className="w-full bg-slate-800 text-white font-bold p-4 rounded-2xl hover:bg-slate-900 transition flex items-center justify-center gap-3 shadow-md">
                                    <span className="text-2xl">👔</span> <span>Acesso Gestor</span>
                                </button>
                                <button onClick={() => {
                                    setUserRole('OPERACIONAL'); localStorage.setItem('rubi_frota_role', 'OPERACIONAL'); setView('rotas');
                                }} className="w-full bg-blue-50 text-blue-700 font-bold p-4 rounded-2xl border border-blue-200 hover:bg-blue-100 transition flex items-center justify-center gap-3">
                                    <span className="text-2xl">🚛</span> <span>Acesso Operacional</span>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // VARIÁVEIS COMPUTADAS
            const isGlobal = veiculoAtivo === 'TODOS';
            const veiculoAtual = isGlobal ? null : veiculos.find(v => v.placa === veiculoAtivo);
            const kmAtualNum = veiculoAtual ? parseFloat(veiculoAtual.kmAtual) || 0 : 0;
            
            const despesasFiltradas = isGlobal ? despesas.slice().reverse() : despesas.filter(d => d.placa === veiculoAtivo).reverse();
            const lembretesFiltrados = isGlobal ? lembretes : lembretes.filter(l => l.placa === veiculoAtivo);
            const rotasFiltradas = isGlobal ? rotas.slice().reverse() : rotas.filter(r => r.placa === veiculoAtivo).reverse();
            const totalGasto = despesasFiltradas.reduce((acc, curr) => acc + (parseFloat(curr.valor) || 0), 0);

            const formatCurrency = (val) => isNaN(parseFloat(val)) ? 'R$ 0,00' : parseFloat(val).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            const getKmAtual = (placa) => {
                const v = veiculos.find(ve => ve.placa === placa);
                return v ? parseFloat(v.kmAtual) || 0 : 0;
            };

            const atualizarKmVeiculo = (novoKmInformado, placaVeiculo) => {
                const novoKm = parseFloat(novoKmInformado);
                const veiculoAlvo = veiculos.find(v => v.placa === placaVeiculo);
                if (veiculoAlvo && novoKm > (parseFloat(veiculoAlvo.kmAtual) || 0)) {
                    return veiculos.map(v => v.placa === placaVeiculo ? { ...v, kmAtual: novoKm } : v);
                }
                return veiculos;
            };

            // FUNÇÕES DE AÇÃO
            const handleAddVeiculo = () => {
                if (!novoVeiculo.veiculo || !novoVeiculo.placa) return alert('Veículo e Matrícula/Placa são obrigatórios!');
                const placaUpper = novoVeiculo.placa.toUpperCase();
                if (veiculos.find(v => v.placa === placaUpper)) return alert('Matrícula já registada!');
                const novosVeiculos = [...veiculos, { ...novoVeiculo, placa: placaUpper }];
                setVeiculos(novosVeiculos);
                salvarNaNuvem(novosVeiculos, despesas, lembretes, rotas);
                setVeiculoAtivo(placaUpper);
                setNovoVeiculo({ veiculo: '', placa: '', motorista: '', centroCusto: '', kmAtual: '' });
                setShowCadastro(false);
                setView('dashboard');
            };

            const handleAddDespesa = () => {
                if (isGlobal) return alert('Selecione uma viatura específica.');
                let valorFinal = novaDespesa.valor;
                if (view === 'os') {
                    const totalOS = (parseFloat(novaDespesa.valorMaoObra) || 0) + (parseFloat(novaDespesa.valorPecas) || 0);
                    if (totalOS <= 0 && novaDespesa.situacao === 'Concluída' && userRole === 'GESTOR') {
                        return setFormError('Informe o valor da Mão de Obra ou das Peças para O.S. Concluída.');
                    }
                    valorFinal = totalOS > 0 ? totalOS.toFixed(2) : '0.00';
                }
                if (!novaDespesa.data) return setFormError('A data é obrigatória.');
                setFormError('');

                let novosVeiculos = veiculos;
                if (novaDespesa.km) {
                    novosVeiculos = atualizarKmVeiculo(novaDespesa.km, veiculoAtivo);
                    setVeiculos(novosVeiculos);
                }

                let novasDespesas = [...despesas];
                if (editingDespesaIndex !== null) {
                    novasDespesas[editingDespesaIndex] = { ...novaDespesa, valor: valorFinal, placa: veiculoAtivo };
                    alert('Registo atualizado!');
                } else {
                    novasDespesas = [...despesas, { ...novaDespesa, valor: valorFinal, placa: veiculoAtivo }];
                    alert('Registo guardado!');
                }

                setDespesas(novasDespesas);
                salvarNaNuvem(novosVeiculos, novasDespesas, lembretes, rotas);
                setEditingDespesaIndex(null);
                setNovaDespesa(defaultDespesa);
                if(userRole === 'GESTOR') setView('historico');
            };

            const handleEditDespesa = (despesa) => {
                const indexReal = despesas.indexOf(despesa);
                setEditingDespesaIndex(indexReal);
                setNovaDespesa(despesa);
                setView(despesa.categoria === 'Abastecimento' ? 'abastecimento' : 'os');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const removerDespesa = (despesa) => {
                if(confirm("Deseja eliminar este registo?")) {
                    const novasDespesas = despesas.filter(d => d !== despesa);
                    setDespesas(novasDespesas);
                    salvarNaNuvem(veiculos, novasDespesas, lembretes, rotas);
                }
            };

            const handleAddLembrete = () => {
                if (isGlobal) return alert('Selecione uma viatura específica.');
                if (!novoLembrete.freqKm && !novoLembrete.freqMeses) return alert('Indique a frequência em KM ou Meses.');
                const novosLembretes = [...lembretes, { ...novoLembrete, id: Date.now(), placa: veiculoAtivo }];
                setLembretes(novosLembretes);
                salvarNaNuvem(veiculos, despesas, novosLembretes, rotas);
                setNovoLembrete({ tipo: 'Troca de Óleo e Filtro', freqKm: '', freqMeses: '', ultimoKm: kmAtualNum || '', ultimaData: new Date().toISOString().split('T')[0] });
            };

            const removerLembrete = (id) => {
                if(confirm("Eliminar alerta?")) {
                    const novosLembretes = lembretes.filter(l => l.id !== id);
                    setLembretes(novosLembretes);
                    salvarNaNuvem(veiculos, despesas, novosLembretes, rotas);
                }
            };

            const handleCriarRota = () => {
                if(isGlobal) return alert('Selecione uma viatura para delegar a rota.');
                if(!novaRotaGestor.origem || !novaRotaGestor.destino) return alert('Origem e destino são obrigatórios.');
                const novaRota = {
                    id: Date.now(), placa: veiculoAtivo, status: 'Pendente',
                    origem: novaRotaGestor.origem, destino: novaRotaGestor.destino, observacoes: novaRotaGestor.observacoes,
                    data: '', motorista: '', ajudante1: '', ajudante2: '', kmInicial: '', kmFinal: ''
                };
                const novasRotas = [...rotas, novaRota];
                setRotas(novasRotas);
                salvarNaNuvem(veiculos, despesas, lembretes, novasRotas);
                setNovaRotaGestor({origem: '', destino: '', observacoes: ''});
                alert('Rota agendada!');
            };

            const iniciarExecucaoRota = (rota) => {
                setExecucaoRota({ ...rota, data: new Date().toISOString().split('T')[0], kmInicial: kmAtualNum });
            };

            const handleConcluirRota = () => {
                if(!execucaoRota.data || !execucaoRota.kmInicial || !execucaoRota.kmFinal || !execucaoRota.motorista) {
                    return setFormError('Data, Motorista, KM Inicial e Final são obrigatórios.');
                }
                if(parseFloat(execucaoRota.kmFinal) <= parseFloat(execucaoRota.kmInicial)) {
                    return setFormError('O KM Final deve ser maior que o KM Inicial.');
                }
                setFormError('');

                const novosVeiculos = atualizarKmVeiculo(execucaoRota.kmFinal, veiculoAtivo);
                setVeiculos(novosVeiculos);
                const novasRotas = rotas.map(r => r.id === execucaoRota.id ? { ...r, status: 'Concluída', ...execucaoRota } : r);
                setRotas(novasRotas);
                salvarNaNuvem(novosVeiculos, despesas, lembretes, novasRotas);
                setExecucaoRota(null);
                alert('Viagem concluída com sucesso!');
            };

            const removerRota = (id) => {
                if(confirm("Deseja cancelar esta rota?")) {
                    const novasRotas = rotas.filter(r => r.id !== id);
                    setRotas(novasRotas);
                    salvarNaNuvem(veiculos, despesas, lembretes, novasRotas);
                }
            };

            // FUNÇÕES DE STATUS (SAÚDE DO VEÍCULO)
            const checkStatusLembrete = (lembrete) => {
                const kmDoVeiculoAlvo = getKmAtual(lembrete.placa);
                let status = { cor: 'bg-green-50 border-green-500 text-green-700', icone: '✅', msg: 'No Prazo', critico: false };
                
                if (lembrete.freqKm) {
                    const limiteKm = parseFloat(lembrete.ultimoKm) + parseFloat(lembrete.freqKm);
                    if (kmDoVeiculoAlvo >= limiteKm) return { cor: 'bg-red-50 border-red-500 text-red-700', icone: '🚨', msg: 'Vencido (KM)', critico: true };
                    else if (limiteKm - kmDoVeiculoAlvo <= 1000) status = { cor: 'bg-amber-50 border-amber-500 text-amber-700', icone: '⚠️', msg: 'Atenção: KM Próximo', critico: false };
                }

                if (lembrete.freqMeses && !status.critico) {
                    const dataLimite = new Date(lembrete.ultimaData);
                    dataLimite.setMonth(dataLimite.getMonth() + parseInt(lembrete.freqMeses));
                    const hoje = new Date();
                    if (hoje >= dataLimite) return { cor: 'bg-red-50 border-red-500 text-red-700', icone: '🚨', msg: 'Vencido (Prazo)', critico: true };
                    else {
                        const diffDias = (dataLimite - hoje) / (1000 * 60 * 60 * 24);
                        if (diffDias <= 15) status = { cor: 'bg-amber-50 border-amber-500 text-amber-700', icone: '📅', msg: 'Atenção: Prazo Próximo', critico: false };
                    }
                }
                return status;
            };

            const checkSaudeVeiculo = (placa) => {
                const lembretesDoVeiculo = lembretes.filter(l => l.placa === placa);
                if (lembretesDoVeiculo.length === 0) return 'OK';
                let temCritico = false;
                let temAviso = false;
                lembretesDoVeiculo.forEach(l => {
                    const st = checkStatusLembrete(l);
                    if (st.critico) temCritico = true;
                    if (st.icone === '⚠️' || st.icone === '📅') temAviso = true;
                });
                if (temCritico) return 'CRITICO';
                if (temAviso) return 'AVISO';
                return 'OK';
            };

            const handleImageUpload = (e) => {
                const arquivos = Array.from(e.target.files);
                arquivos.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = event => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            let w = img.width, h = img.height;
                            if (w > 1200) { h *= 1200 / w; w = 1200; }
                            canvas.width = w; canvas.height = h;
                            ctx.drawImage(img, 0, 0, w, h);
                            setNovaDespesa(prev => ({ ...prev, anexos: [...(prev.anexos || []), canvas.toDataURL('image/jpeg', 0.7)] }));
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const generatePDF = () => {
                setIsGenerating(true);
                const mainUi = document.getElementById('main-ui');
                const pdfContent = document.getElementById('pdf-content');
                mainUi.style.display = 'none';
                pdfContent.style.display = 'block';
                window.scrollTo(0, 0);
                const filename = isGlobal ? `Relatorio_RUBI_FROTA_Global.pdf` : `Dossie_${veiculoAtual.placa}.pdf`;
                const opt = { margin: [5, 5, 10, 5], filename: filename, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true, scrollY: 0 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
                window.html2pdf().set(opt).from(pdfContent).save().then(() => {
                    mainUi.style.display = 'block';
                    pdfContent.style.display = 'none';
                    setIsGenerating(false);
                }).catch(() => setIsGenerating(false));
            };

            return (
                <div className="min-h-screen font-sans text-slate-800 pb-24 md:pb-10 max-w-md md:max-w-4xl mx-auto md:mt-4 shadow-xl bg-white md:rounded-3xl overflow-hidden relative border border-slate-200">
                    
                    <div id="main-ui">
                        {/* CABEÇALHO */}
                        <div className="bg-slate-900 text-white p-5 rounded-b-3xl md:rounded-t-3xl md:rounded-b-none shadow-md">
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex items-center gap-3">
                                    <h1 className="text-xl font-black tracking-tight text-blue-400">RUBI<span className="text-white font-light">FROTA</span></h1>
                                    <button onClick={carregarDaNuvem} className="bg-slate-800 border border-slate-700 text-[9px] font-bold px-2 py-1 rounded-lg text-slate-300">
                                        {syncStatus}
                                    </button>
                                </div>
                                <div className="flex gap-2">
                                    {userRole === 'GESTOR' && (
                                        <button onClick={() => setShowCadastro(!showCadastro)} className="bg-blue-600 hover:bg-blue-500 text-[10px] px-3 py-1.5 rounded-full font-bold">
                                            {showCadastro ? 'Cancelar' : '+ Veículo'}
                                        </button>
                                    )}
                                    <button onClick={handleLogout} className="bg-red-500 hover:bg-red-600 text-[10px] font-bold px-3 py-1.5 rounded-full">Sair</button>
                                </div>
                            </div>
                            
                            {!showCadastro && veiculos.length > 0 && (
                                <div className="bg-slate-800 rounded-2xl p-2 flex items-center border border-slate-700">
                                    <span className="pl-3 text-slate-400 text-xl">{isGlobal ? '🌐' : '🚘'}</span>
                                    <select className="w-full p-2 bg-transparent text-white font-bold outline-none appearance-none" 
                                            value={veiculoAtivo} onChange={e => { 
                                                setVeiculoAtivo(e.target.value); setExecucaoRota(null);
                                                if (userRole === 'GESTOR') setView('dashboard');
                                            }}>
                                        {userRole === 'GESTOR' && <option value="TODOS" className="text-slate-900 font-bold bg-slate-100">🌐 VISÃO GLOBAL (Toda a Frota)</option>}
                                        {userRole === 'OPERACIONAL' && <option value="TODOS" className="text-slate-900 font-bold bg-slate-100">-- Selecione a Viatura --</option>}
                                        {veiculos.map((v, i) => <option key={i} value={v.placa} className="text-slate-900">{v.placa} - {v.veiculo}</option>)}
                                    </select>
                                </div>
                            )}
                        </div>

                        {/* CADASTRO DE VEÍCULO (SÓ GESTOR) */}
                        {showCadastro && userRole === 'GESTOR' && (
                            <div className="p-5 animate-fade-in space-y-4">
                                <h2 className="font-bold text-lg text-slate-800">Registar Novo Veículo</h2>
                                <input className="w-full border p-3 rounded-xl outline-none" placeholder="Marca / Modelo" value={novoVeiculo.veiculo} onChange={e => setNovoVeiculo({...novoVeiculo, veiculo: e.target.value})} />
                                <input className="w-full border p-3 rounded-xl outline-none uppercase" placeholder="Matrícula / Placa" value={novoVeiculo.placa} onChange={e => setNovoVeiculo({...novoVeiculo, placa: e.target.value})} />
                                <input type="number" className="w-full border p-3 rounded-xl outline-none" placeholder="KM Inicial (Odómetro)" value={novoVeiculo.kmAtual} onChange={e => setNovoVeiculo({...novoVeiculo, kmAtual: e.target.value})} />
                                <input className="w-full border p-3 rounded-xl outline-none" placeholder="Motorista Principal" value={novoVeiculo.motorista} onChange={e => setNovoVeiculo({...novoVeiculo, motorista: e.target.value})} />
                                <button onClick={handleAddVeiculo} className="w-full bg-blue-700 text-white font-bold p-4 rounded-xl shadow-lg">Guardar Veículo</button>
                            </div>
                        )}

                        {/* BLOQUEIOS */}
                        {!showCadastro && isGlobal && veiculos.length > 0 && userRole === 'GESTOR' && (view === 'rotas' || view === 'os' || view === 'abastecimento' || view === 'lembretes') && (
                            <div className="p-10 text-center text-slate-500 animate-fade-in mt-10">
                                <span className="text-5xl block mb-4 opacity-50">🔒</span>

                                                <div>
                                                    <label className="text-[10px] font-bold text-blue-700 uppercase">Frequência por KM</label>
                                                    <input type="number" className="w-full border p-2 rounded-lg text-sm" placeholder="Ex: 10000" value={novoLembrete.freqKm} onChange={e => setNovoLembrete({...novoLembrete, freqKm: e.target.value})} />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-bold text-blue-700 uppercase">Frequência de Tempo</label>
                                                    <select className="w-full border p-2 rounded-lg text-sm bg-white" value={novoLembrete.freqMeses} onChange={e => setNovoLembrete({...novoLembrete, freqMeses: e.target.value})}>
                                                        <option value="">Apenas KM...</option><option value="3">3 meses</option><option value="6">6 meses</option><option value="12">12 meses</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2 bg-white p-2 rounded-xl border">
                                                <div>
                                                    <label className="text-[9px] font-bold text-slate-500 uppercase">KM da Última Troca</label>
                                                    <input type="number" className="w-full border p-2 rounded-lg text-sm bg-slate-50" value={novoLembrete.ultimoKm} onChange={e => setNovoLembrete({...novoLembrete, ultimoKm: e.target.value})} />
                                                </div>
                                                <div>
                                                    <label className="text-[9px] font-bold text-slate-500 uppercase">Data da Última Troca</label>
                                                    <input type="date" className="w-full border p-2 rounded-lg text-sm bg-slate-50" value={novoLembrete.ultimaData} onChange={e => setNovoLembrete({...novoLembrete, ultimaData: e.target.value})} />
                                                </div>
                                            </div>
                                            <button onClick={handleAddLembrete} className="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold p-3 rounded-xl text-sm shadow">Guardar Alerta</button>
                                        </div>
                                        <div className="space-y-2">
                                            <h3 className="font-bold text-slate-700 text-sm mt-4">Regras Ativas ({lembretesFiltrados.length})</h3>
                                            {lembretesFiltrados.map(l => (
                                                <div key={l.id} className="bg-white p-3 rounded-xl border border-slate-200 flex justify-between items-center shadow-sm">
                                                    <div>
                                                        <p className="font-bold text-sm text-slate-800">{l.tipo}</p>
                                                        <p className="text-[10px] text-slate-500">
                                                            {l.freqKm && <span>A cada {l.freqKm} km</span>} {l.freqKm && l.freqMeses && <span> OU </span>} {l.freqMeses && <span>A cada {l.freqMeses} meses</span>}
                                                        </p>
                                                    </div>
                                                    <button onClick={() => removerLembrete(l.id)} className="bg-red-50 text-red-600 p-2 rounded-lg text-xs font-bold hover:bg-red-100">Excluir</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* 6. HISTÓRICO E RELATÓRIOS (SÓ GESTOR) */}
                                {view === 'historico' && userRole === 'GESTOR' && (
                                    <div className="animate-fade-in space-y-4">
                                        <div className="flex justify-between items-center">
                                            <h2 className="text-xl font-bold text-slate-800">🧾 Histórico de Lançamentos</h2>
                                            <button onClick={generatePDF} disabled={isGenerating || despesasFiltradas.length === 0} className="bg-slate-800 text-white text-xs font-bold px-3 py-2 rounded-lg shadow disabled:opacity-50">
                                                {isGenerating ? 'A exportar...' : 'Exportar PDF'}
                                            </button>
                                        </div>
                                        {despesasFiltradas.length === 0 ? <p className="text-center text-slate-400 py-10">Nenhum registo encontrado.</p> : (
                                            despesasFiltradas.map((d, i) => (
                                                <div key={i} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                                                    <div className="flex justify-between items-start mb-2 border-b border-slate-100 pb-2">
                                                        <div>
                                                            <span className="font-bold text-slate-800 uppercase block text-sm flex items-center gap-2">
                                                                {d.categoria} {isGlobal && <span className="bg-blue-100 text-blue-800 text-[10px] px-2 py-0.5 rounded font-black">{d.placa}</span>}
                                                            </span>
                                                            <span className="text-xs text-slate-500">{d.data} • KM: {d.km || '-'}</span>
                                                        </div>
                                                        <div className="text-right">
                                                            <span className="text-lg font-black text-blue-700 block">{formatCurrency(d.valor)}</span>
                                                            {d.situacao && <span className={`text-[9px] px-1.5 py-0.5 rounded font-bold uppercase mt-1 inline-block ${d.situacao==='Orçamento'?'bg-amber-100 text-amber-800':d.situacao==='Em Andamento'?'bg-blue-100 text-blue-800':'bg-green-100 text-green-800'}`}>{d.situacao}</span>}
                                                        </div>
                                                    </div>
                                                    <div className="text-sm text-slate-600 leading-tight space-y-1">
                                                        {d.fornecedor && <p>🏢 <strong>{d.fornecedor}</strong></p>}
                                                        {d.descricao && <p>🔧 {d.descricao}</p>}
                                                        {(d.valorMaoObra || d.valorPecas) && (
                                                            <div className="bg-slate-50 p-2 rounded border border-slate-200 mt-2 grid grid-cols-2 text-xs">
                                                                <p className="text-slate-500">M. Obra: <strong className="text-slate-800">{d.valorMaoObra ? formatCurrency(d.valorMaoObra) : 'R$ 0,00'}</strong></p>
                                                                <p className="text-slate-500">Peças: <strong className="text-slate-800">{d.valorPecas ? formatCurrency(d.valorPecas) : 'R$ 0,00'}</strong></p>
                                                            </div>
                                                        )}
                                                    </div>
                                                    <div className="flex justify-between items-center mt-3 pt-2 border-t border-slate-100">
                                                        {d.anexos && d.anexos.length > 0 ? (
                                                            <details className="text-sm">
                                                                <summary className="text-blue-700 font-bold bg-blue-50 px-3 py-1 rounded-lg border border-blue-100 inline-block">📸 Ver {d.anexos.length} Anexo(s) ▾</summary>
                                                                <div className="flex flex-wrap gap-2 mt-2 p-2 bg-slate-50 rounded-lg border border-slate-200">
                                                                    {d.anexos.map((img, idx) => <img key={idx} src={img} className="h-16 w-16 object-cover rounded shadow-sm border border-slate-300" />)}
                                                                </div>
                                                            </details>
                                                        ) : <div className="text-xs text-slate-300">Sem anexos</div>}
                                                        <div className="flex gap-4">
                                                            <button onClick={() => handleEditDespesa(d)} className="text-amber-600 text-xs font-bold underline">Editar</button>
                                                            <button onClick={() => removerDespesa(d)} className="text-red-500 text-xs font-bold underline">Excluir</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                        
                        {/* MENU INFERIOR */}
                        {!showCadastro && veiculos.length > 0 && (
                            <div className="fixed md:absolute bottom-0 left-0 w-full bg-white border-t border-slate-200 px-1 py-2 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-50 overflow-x-auto hide-scroll">
                                {userRole === 'GESTOR' ? (
                                    <div className="flex justify-between items-center min-w-full gap-1">
                                        <button onClick={() => { setView('dashboard'); setEditingDespesaIndex(null); }} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'dashboard' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">🏠</span><span className="text-[9px] font-bold uppercase">Painel</span>
                                        </button>
                                        <button onClick={() => { setView('rotas'); setEditingDespesaIndex(null); }} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'rotas' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">🗺️</span><span className="text-[9px] font-bold uppercase">Rotas</span>
                                        </button>
                                        <button onClick={() => { setView('abastecimento'); if(editingDespesaIndex === null) setNovaDespesa({...novaDespesa, categoria: 'Abastecimento', situacao: 'Concluída'}); }} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'abastecimento' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">⛽</span><span className="text-[9px] font-bold uppercase">Posto</span>
                                        </button>
                                        <button onClick={() => { setView('os'); if(editingDespesaIndex === null) setNovaDespesa({...novaDespesa, categoria: 'Mecânica / Manutenção', situacao: 'Concluída'}); }} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'os' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">🔧</span><span className="text-[9px] font-bold uppercase">O.S.</span>
                                        </button>
                                        <button onClick={() => { setView('historico'); setEditingDespesaIndex(null); }} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'historico' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">🧾</span><span className="text-[9px] font-bold uppercase">Histórico</span>
                                        </button>
                                        <button onClick={() => { setView('lembretes'); setEditingDespesaIndex(null); }} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'lembretes' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">🔔</span><span className="text-[9px] font-bold uppercase">Alertas</span>
                                        </button>
                                    </div>
                                ) : (
                                    <div className="flex justify-center items-center min-w-full gap-2 px-2">
                                        <button onClick={() => { setView('rotas'); setExecucaoRota(null); }} className={`w-1/2 flex flex-col items-center justify-center p-2 rounded-xl transition-colors border ${view === 'rotas' ? 'text-blue-700 bg-blue-50 border-blue-200' : 'text-slate-500 border-transparent'}`}>
                                            <span className="text-2xl mb-1">🗺️</span><span className="text-xs font-bold uppercase">Viagens</span>
                                        </button>
                                        <button onClick={() => { setView('os'); setNovaDespesa({...novaDespesa, categoria: 'Mecânica / Manutenção', situacao: 'Concluída'}); }} className={`w-1/2 flex flex-col items-center justify-center p-2 rounded-xl transition-colors border ${view === 'os' ? 'text-blue-700 bg-blue-50 border-blue-200' : 'text-slate-500 border-transparent'}`}>
                                            <span className="text-2xl mb-1">🔧</span><span className="text-xs font-bold uppercase">Registar O.S.</span>
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* PDF INVISÍVEL */}
                    <div id="pdf-content" style={{ display: 'none', width: '100%', backgroundColor: 'white', color: 'black', fontFamily: 'Arial', padding: '10px' }}>
                        <div className="bg-slate-800 text-white rounded-lg p-2 mb-3 text-center">
                            <h1 className="text-xl font-bold uppercase">{isGlobal ? 'Dossiê Consolidado RUBI FROTA' : 'Dossiê de Manutenção'}</h1>
                        </div>
                        <div className="border border-slate-300 rounded-lg p-3 mb-4 text-sm">
                            <div className="grid grid-cols-2 gap-2">
                                {isGlobal ? (
                                    <>
                                        <div><p className="text-[10px] text-slate-500 font-bold uppercase">Empresa / Frota</p><p className="font-bold">Visão Global</p></div>
                                        <div><p className="text-[10px] text-slate-500 font-bold uppercase">Total Veículos Registados</p><p className="font-bold">{veiculos.length}</p></div>
                                    </>
                                ) : (
                                    <>
                                        <div><p className="text-[10px] text-slate-500 font-bold uppercase">Veículo</p><p className="font-bold">{veiculoAtual?.veiculo}</p></div>
                                        <div><p className="text-[10px] text-slate-500 font-bold uppercase">Matrícula</p><p className="font-bold">{veiculoAtual?.placa}</p></div>
                                    </>
                                )}
                                <div className="col-span-2 pt-2 border-t border-slate-200 mt-1 flex justify-between">
                                    <p className="text-[10px] text-slate-500 font-bold uppercase">Custo Total Registado</p>
                                    <p className="font-black text-blue-800 text-base">{formatCurrency(totalGasto)}</p>
                                </div>
                            </div>
                        </div>
                        <div className="space-y-4">
                            {despesasFiltradas.map((d, idx) => (
                                <div key={idx} className="break-inside-avoid border-b pb-3 mb-3">
                                    <div className="flex justify-between items-center mb-1">
                                        <h2 className="text-sm font-black uppercase text-slate-800">#{idx + 1} - {d.categoria} {isGlobal && ` [Viatura: ${d.placa}]`}</h2>
                                        <p className="text-sm font-black">{formatCurrency(d.valor)}</p>
                                    </div>
                                    <div className="flex justify-between items-center mb-1">
                                        <p className="text-[10px] font-bold text-slate-500">{d.data} • KM: {d.km || 'N/I'}</p>
                                        {d.situacao && <p className="text-[9px] font-bold text-slate-500 uppercase">Estado: {d.situacao}</p>}
                                    </div>
                                    <div className="bg-slate-50 p-2 rounded text-[11px] border border-slate-200">
                                        {d.tipoOS && <p><strong>Intervenção:</strong> {d.tipoOS} | <strong>Local:</strong> {d.localOS}</p>}
                                        <p><strong>Fornecedor:</strong> {d.fornecedor || 'N/A'}</p>
                                        {d.descricao && <p><strong>Descrição:</strong> {d.descricao}</p>}
                                        {(d.valorMaoObra || d.valorPecas) && (
                                            <div className="border-t border-slate-200 mt-2 pt-1 flex gap-4 text-[10px] text-slate-600">
                                                <span>Mão de Obra: <strong>{d.valorMaoObra ? formatCurrency(d.valorMaoObra) : 'R$ 0,00'}</strong></span>
                                                <span>Peças: <strong>{d.valorPecas ? formatCurrency(d.valorPecas) : 'R$ 0,00'}</strong></span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ControleFrotaMulti />);
    </script>
</body>
</html>
