<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUBI FROTA - Gestão Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    
    <style>
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7N4C1lZperjJZiDlk_SPDEl4OlfvuvbjdePeWKa-qr2ojbu4kmL862ntMjjcZNPrPQQ/exec';

        function ControleFrotaMulti() {
            const [userRole, setUserRole] = useState(null); 
            
            const [veiculos, setVeiculos] = useState([]);
            const [veiculoAtivo, setVeiculoAtivo] = useState('TODOS'); 
            const [despesas, setDespesas] = useState([]);
            const [lembretes, setLembretes] = useState([]);
            const [rotas, setRotas] = useState([]);
            
            const [view, setView] = useState('dashboard');
            const [showCadastro, setShowCadastro] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [formError, setFormError] = useState('');
            const [syncStatus, setSyncStatus] = useState('☁️ A conectar...');
            const [editingDespesaIndex, setEditingDespesaIndex] = useState(null);

            const [novoVeiculo, setNovoVeiculo] = useState({ 
                veiculo: '', placa: '', motorista: '', centroCusto: '', kmAtual: '' 
            });

            const defaultDespesa = {
                categoria: 'Mecânica / Manutenção', data: new Date().toISOString().split('T')[0], 
                valor: '', valorMaoObra: '', valorPecas: '', situacao: 'Concluída',
                km: '', fornecedor: '', nf: '', descricao: '', pecas: '',
                tipoOS: 'Corretiva', localOS: 'Externa', kmPercorrido: '', consumoKmLitro: '', precoCombustivel: '', anexos: []
            };

            const [novaDespesa, setNovaDespesa] = useState(defaultDespesa);

            const [novoLembrete, setNovoLembrete] = useState({
                tipo: 'Troca de Óleo e Filtro', freqKm: '', freqMeses: '', ultimoKm: '', ultimaData: new Date().toISOString().split('T')[0]
            });

            // ESTADOS DE ROTAS
            const [novaRotaGestor, setNovaRotaGestor] = useState({ origem: '', destino: '', observacoes: '' });
            const [execucaoRota, setExecucaoRota] = useState(null);

            useEffect(() => {
                const savedRole = localStorage.getItem('rubi_frota_role');
                if (savedRole) {
                    setUserRole(savedRole);
                    if (savedRole === 'OPERACIONAL') setView('rotas');
                }
                carregarDaNuvem();
            }, []);

            const carregarDaNuvem = async () => {
                setSyncStatus('⏳ A puxar dados...');
                try {
                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'carregar' }) });
                    const result = await response.json();
                    
                    if (result.status === 'sucesso') {
                        if (result.dados.veiculos) setVeiculos(result.dados.veiculos);
                        if (result.dados.despesas) setDespesas(result.dados.despesas);
                        if (result.dados.lembretes) setLembretes(result.dados.lembretes);
                        if (result.dados.rotas) setRotas(result.dados.rotas);
                        setSyncStatus('☁️ OK');
                        localStorage.setItem('rubi_frota_db', JSON.stringify(result.dados));
                    }
                } catch (error) {
                    setSyncStatus('⚠️ Offline');
                    const saved = localStorage.getItem('rubi_frota_db');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed.veiculos) setVeiculos(parsed.veiculos);
                        if (parsed.despesas) setDespesas(parsed.despesas);
                        if (parsed.lembretes) setLembretes(parsed.lembretes);
                        if (parsed.rotas) setRotas(parsed.rotas);
                    }
                }
            };

            const salvarNaNuvem = async (veics, desps, lembs, rots) => {
                setSyncStatus('⏳ A guardar...');
                localStorage.setItem('rubi_frota_db', JSON.stringify({ veiculos: veics, despesas: desps, lembretes: lembs, rotas: rots }));
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'sincronizar', veiculos: veics, despesas: desps, lembretes: lembs, rotas: rots })
                    });
                    const result = await response.json();
                    if (result.status === 'sucesso') setSyncStatus('☁️ OK');
                    else setSyncStatus('⚠️ Erro Sync');
                } catch (error) {
                    setSyncStatus('⚠️ Offline');
                }
            };

            const handleLogout = () => {
                if(confirm("Deseja sair da sua conta atual?")) {
                    setUserRole(null);
                    localStorage.removeItem('rubi_frota_role');
                    setView('dashboard');
                }
            };

            if (!userRole) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 p-6 animate-fade-in">
                        <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>
                            <h1 className="text-4xl font-black tracking-tight text-blue-600 mb-1 mt-4">RUBI<span className="text-slate-800 font-light">FROTA</span></h1>
                            <p className="text-slate-500 text-sm mb-10">Selecione o seu perfil de acesso</p>
                            <div className="space-y-4">
                                <button onClick={() => {
                                    const pin = prompt("Digite a senha do Gestor (A senha padrão é 1234):");
                                    if (pin === '1234') { setUserRole('GESTOR'); localStorage.setItem('rubi_frota_role', 'GESTOR'); setView('dashboard'); } 
                                    else if (pin !== null) alert('Senha incorreta!');
                                }} className="w-full bg-slate-800 text-white font-bold p-4 rounded-2xl hover:bg-slate-900 transition flex items-center justify-center gap-3 shadow-md">
                                    <span className="text-2xl">👔</span> <span>Acesso Gestor</span>
                                </button>
                                <button onClick={() => {
                                    setUserRole('OPERACIONAL'); localStorage.setItem('rubi_frota_role', 'OPERACIONAL'); setView('rotas');
                                }} className="w-full bg-blue-50 text-blue-700 font-bold p-4 rounded-2xl border border-blue-200 hover:bg-blue-100 transition flex items-center justify-center gap-3">
                                    <span className="text-2xl">🚛</span> <span>Acesso Operacional</span>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            const isGlobal = veiculoAtivo === 'TODOS';
            const veiculoAtual = isGlobal ? null : veiculos.find(v => v.placa === veiculoAtivo);
            const kmAtualNum = veiculoAtual ? parseFloat(veiculoAtual.kmAtual) || 0 : 0;
            const rotasFiltradas = isGlobal ? rotas.slice().reverse() : rotas.filter(r => r.placa === veiculoAtivo).reverse();

            const atualizarKmVeiculo = (novoKmInformado, placaVeiculo) => {
                const novoKm = parseFloat(novoKmInformado);
                const veiculoAlvo = veiculos.find(v => v.placa === placaVeiculo);
                if (veiculoAlvo && novoKm > (parseFloat(veiculoAlvo.kmAtual) || 0)) {
                    return veiculos.map(v => v.placa === placaVeiculo ? { ...v, kmAtual: novoKm } : v);
                }
                return veiculos;
            };

            // FUNÇÕES DE ROTA
            const handleCriarRota = () => {
                if(isGlobal) return alert('Selecione uma viatura para delegar a rota.');
                if(!novaRotaGestor.origem || !novaRotaGestor.destino) return alert('Origem e destino são obrigatórios.');

                const novaRota = {
                    id: Date.now(), placa: veiculoAtivo, status: 'Pendente',
                    origem: novaRotaGestor.origem, destino: novaRotaGestor.destino, observacoes: novaRotaGestor.observacoes,
                    data: '', motorista: '', ajudante1: '', ajudante2: '', kmInicial: '', kmFinal: ''
                };

                const novasRotas = [...rotas, novaRota];
                setRotas(novasRotas);
                salvarNaNuvem(veiculos, despesas, lembretes, novasRotas);
                setNovaRotaGestor({origem: '', destino: '', observacoes: ''});
                alert('Rota agendada com sucesso!');
            };

            const iniciarExecucaoRota = (rota) => {
                setExecucaoRota({
                    ...rota, 
                    data: new Date().toISOString().split('T')[0],
                    kmInicial: kmAtualNum
                });
            };

            const handleConcluirRota = () => {
                if(!execucaoRota.data || !execucaoRota.kmInicial || !execucaoRota.kmFinal || !execucaoRota.motorista) {
                    return setFormError('Data, Motorista, KM Inicial e Final são obrigatórios.');
                }
                if(parseFloat(execucaoRota.kmFinal) <= parseFloat(execucaoRota.kmInicial)) {
                    return setFormError('O KM Final deve ser maior que o KM Inicial.');
                }
                setFormError('');

                const novosVeiculos = atualizarKmVeiculo(execucaoRota.kmFinal, veiculoAtivo);
                setVeiculos(novosVeiculos);

                const novasRotas = rotas.map(r => r.id === execucaoRota.id ? { ...r, status: 'Concluída', ...execucaoRota } : r);
                setRotas(novasRotas);
                salvarNaNuvem(novosVeiculos, despesas, lembretes, novasRotas);

                setExecucaoRota(null);
                alert('Rota finalizada e quilometragem atualizada!');
            };

            const removerRota = (id) => {
                if(confirm("Deseja cancelar/excluir esta rota?")) {
                    const novasRotas = rotas.filter(r => r.id !== id);
                    setRotas(novasRotas);
                    salvarNaNuvem(veiculos, despesas, lembretes, novasRotas);
                }
            };

            return (
                <div className="min-h-screen font-sans text-slate-800 pb-24 md:pb-10 max-w-md md:max-w-4xl mx-auto md:mt-4 shadow-xl bg-white md:rounded-3xl overflow-hidden relative border border-slate-200">
                    
                    <div id="main-ui">
                        <div className="bg-slate-900 text-white p-5 rounded-b-3xl md:rounded-t-3xl md:rounded-b-none shadow-md">
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex items-center gap-3">
                                    <h1 className="text-xl font-black tracking-tight text-blue-400">RUBI<span className="text-white font-light">FROTA</span></h1>
                                    <button onClick={carregarDaNuvem} className="bg-slate-800 border border-slate-700 text-[9px] font-bold px-2 py-1 rounded-lg text-slate-300">
                                        {syncStatus}
                                    </button>
                                </div>
                                <div className="flex gap-2">
                                    {userRole === 'GESTOR' && (
                                        <button onClick={() => setShowCadastro(!showCadastro)} className="bg-blue-600 hover:bg-blue-500 text-[10px] px-3 py-1.5 rounded-full font-bold">
                                            {showCadastro ? 'Cancelar' : '+ Veículo'}
                                        </button>
                                    )}
                                    <button onClick={handleLogout} className="bg-red-500 hover:bg-red-600 text-[10px] font-bold px-3 py-1.5 rounded-full">Sair</button>
                                </div>
                            </div>
                            
                            {!showCadastro && veiculos.length > 0 && (
                                <div className="bg-slate-800 rounded-2xl p-2 flex items-center border border-slate-700">
                                    <span className="pl-3 text-slate-400 text-xl">{isGlobal ? '🌐' : '🚘'}</span>
                                    <select className="w-full p-2 bg-transparent text-white font-bold outline-none appearance-none" 
                                            value={veiculoAtivo} onChange={e => { 
                                                setVeiculoAtivo(e.target.value); setExecucaoRota(null);
                                                if (userRole === 'GESTOR') setView('dashboard');
                                            }}>
                                        {userRole === 'GESTOR' && <option value="TODOS" className="text-slate-900 font-bold bg-slate-100">🌐 VISÃO GLOBAL (Toda a Frota)</option>}
                                        {userRole === 'OPERACIONAL' && <option value="TODOS" className="text-slate-900 font-bold bg-slate-100">-- Selecione a Viatura --</option>}
                                        {veiculos.map((v, i) => <option key={i} value={v.placa} className="text-slate-900">{v.placa} - {v.veiculo}</option>)}
                                    </select>
                                </div>
                            )}
                        </div>

                        {!showCadastro && isGlobal && veiculos.length > 0 && userRole === 'GESTOR' && (view === 'rotas' || view === 'os') && (
                            <div className="p-10 text-center text-slate-500 animate-fade-in mt-10">
                                <span className="text-5xl block mb-4 opacity-50">🔒</span>
                                <h2 className="font-bold text-xl text-slate-700 mb-2">Ação Não Permitida</h2>
                                <p className="text-sm">Selecione uma viatura específica no menu superior para aceder a esta aba.</p>
                            </div>
                        )}

                        {!showCadastro && isGlobal && veiculos.length > 0 && userRole === 'OPERACIONAL' && (
                            <div className="p-10 text-center text-slate-500 animate-fade-in mt-10">
                                <span className="text-5xl block mb-4 opacity-50">🚘</span>
                                <h2 className="font-bold text-xl text-slate-700 mb-2">Selecione a Viatura</h2>
                                <p className="text-sm">Escolha o seu veículo no menu acima para iniciar a sua jornada.</p>
                            </div>
                        )}

                        {!showCadastro && veiculos.length > 0 && (!isGlobal || (isGlobal && userRole === 'GESTOR' && view === 'dashboard')) && (
                            <div className="p-4 space-y-4 mb-16">
                                
                                {/* VIEW: DASHBOARD GESTOR (Simplificada para poupar espaço de código, assume-se existente como antes) */}
                                {view === 'dashboard' && userRole === 'GESTOR' && (
                                    <div className="animate-fade-in space-y-4">
                                        <div className="bg-slate-800 text-white p-4 rounded-2xl shadow-sm">
                                            <h2 className="font-bold text-lg">{isGlobal ? 'Visão Global' : veiculoAtual.veiculo}</h2>
                                            <p className="text-xs text-slate-400 mb-3">{isGlobal ? `${veiculos.length} veículos` : `KM Atual: ${kmAtualNum}`}</p>
                                        </div>
                                    </div>
                                )}

                                {/* VIEW: ROTAS (NOVA) */}
                                {view === 'rotas' && !isGlobal && (
                                    <div className="animate-fade-in space-y-4">
                                        
                                        {/* Apenas Gestor vê form de criação */}
                                        {userRole === 'GESTOR' && (
                                            <div className="bg-blue-50 p-4 rounded-2xl border border-blue-100 space-y-3">
                                                <h3 className="font-bold text-blue-800 text-sm flex items-center gap-2">🗺️ Agendar Rota</h3>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <input className="w-full border p-2 rounded-lg text-sm" placeholder="Local de Origem" value={novaRotaGestor.origem} onChange={e => setNovaRotaGestor({...novaRotaGestor, origem: e.target.value})} />
                                                    <input className="w-full border p-2 rounded-lg text-sm" placeholder="Local de Destino" value={novaRotaGestor.destino} onChange={e => setNovaRotaGestor({...novaRotaGestor, destino: e.target.value})} />
                                                </div>
                                                <input className="w-full border p-2 rounded-lg text-sm" placeholder="Observações (Cliente, Carga, etc.)" value={novaRotaGestor.observacoes} onChange={e => setNovaRotaGestor({...novaRotaGestor, observacoes: e.target.value})} />
                                                <button onClick={handleCriarRota} className="w-full bg-blue-700 text-white font-bold p-3 rounded-xl text-sm shadow hover:bg-blue-800">Delegar Rota</button>
                                            </div>
                                        )}

                                        {/* Operacional a Executar uma Rota */}
                                        {execucaoRota !== null ? (
                                            <div className="bg-white p-4 rounded-2xl border border-amber-300 shadow-lg relative">
                                                <button onClick={() => setExecucaoRota(null)} className="absolute top-4 right-4 text-slate-400 font-bold text-xs bg-slate-100 px-2 py-1 rounded">Voltar</button>
                                                <h3 className="font-bold text-amber-600 mb-1">▶️ Executar Rota</h3>
                                                <p className="text-sm font-bold text-slate-700">{execucaoRota.origem} ➔ {execucaoRota.destino}</p>
                                                <p className="text-xs text-slate-500 mb-4">{execucaoRota.observacoes}</p>

                                                <div className="space-y-3">
                                                    <div className="grid grid-cols-2 gap-2">
                                                        <input type="date" className="w-full border p-3 rounded-xl bg-slate-50 text-sm" value={execucaoRota.data} onChange={e => setExecucaoRota({...execucaoRota, data: e.target.value})} />
                                                        <input className="w-full border p-3 rounded-xl text-sm" placeholder="Motorista" value={execucaoRota.motorista} onChange={e => setExecucaoRota({...execucaoRota, motorista: e.target.value})} />
                                                    </div>
                                                    <div className="grid grid-cols-2 gap-2">
                                                        <input className="w-full border p-3 rounded-xl text-sm" placeholder="Ajudante 1 (Opcional)" value={execucaoRota.ajudante1} onChange={e => setExecucaoRota({...execucaoRota, ajudante1: e.target.value})} />
                                                        <input className="w-full border p-3 rounded-xl text-sm" placeholder="Ajudante 2 (Opcional)" value={execucaoRota.ajudante2} onChange={e => setExecucaoRota({...execucaoRota, ajudante2: e.target.value})} />
                                                    </div>
                                                    <div className="grid grid-cols-2 gap-2 bg-slate-100 p-3 rounded-xl border border-slate-200">
                                                        <div>
                                                            <label className="text-[10px] font-bold text-slate-500 uppercase">KM Inicial</label>
                                                            <input type="number" className="w-full border p-2 rounded-lg text-sm bg-white font-bold" value={execucaoRota.kmInicial} onChange={e => setExecucaoRota({...execucaoRota, kmInicial: e.target.value})} />
                                                        </div>
                                                        <div>
                                                            <label className="text-[10px] font-bold text-blue-600 uppercase">KM Final (Chegada)</label>
                                                            <input type="number" className="w-full border-2 border-blue-400 p-2 rounded-lg text-sm bg-white font-bold" placeholder="Digite ao chegar" value={execucaoRota.kmFinal} onChange={e => setExecucaoRota({...execucaoRota, kmFinal: e.target.value})} />
                                                        </div>
                                                    </div>
                                                    
                                                    {formError && <p className="text-red-500 font-bold text-xs text-center">{formError}</p>}
                                                    <button onClick={handleConcluirRota} className="w-full bg-green-600 text-white font-bold p-4 rounded-xl shadow-lg hover:bg-green-700">Concluir Viagem</button>
                                                </div>
                                            </div>
                                        ) : (
                                            /* Lista de Rotas */
                                            <div className="space-y-3">
                                                <h3 className="font-bold text-slate-700 text-sm">Diário de Rotas</h3>
                                                {rotasFiltradas.length === 0 ? <p className="text-xs text-slate-400 text-center py-4">Nenhuma rota registada.</p> : null}
                                                
                                                {rotasFiltradas.map(r => (
                                                    <div key={r.id} className={`p-4 rounded-xl border ${r.status === 'Pendente' ? 'bg-white border-amber-300 shadow-sm' : 'bg-slate-50 border-slate-200'}`}>
                                                        <div className="flex justify-between items-start mb-2 border-b border-slate-100 pb-2">
                                                            <div>
                                                                <span className={`text-[10px] px-2 py-0.5 rounded font-bold uppercase mb-1 inline-block ${r.status === 'Pendente' ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700'}`}>
                                                                    {r.status}
                                                                </span>
                                                                <h4 className="font-bold text-slate-800 text-sm leading-tight">{r.origem} ➔ {r.destino}</h4>
                                                                {r.status === 'Concluída' && <p className="text-xs text-slate-500">{r.data} • {r.motorista}</p>}
                                                            </div>
                                                            {r.status === 'Concluída' && (
                                                                <div className="text-right">
                                                                    <p className="text-[10px] font-bold text-slate-400 uppercase">Distância</p>
                                                                    <p className="font-black text-slate-700">{(r.kmFinal - r.kmInicial).toLocaleString()} km</p>
                                                                </div>
                                                            )}
                                                        </div>
                                                        {r.observacoes && <p className="text-xs text-slate-600 mb-2">"{r.observacoes}"</p>}
                                                        
                                                        {r.status === 'Pendente' && userRole === 'OPERACIONAL' && (
                                                            <button onClick={() => iniciarExecucaoRota(r)} className="w-full mt-2 bg-amber-500 text-white font-bold p-2 rounded-lg text-sm shadow">Preencher / Iniciar Viagem</button>
                                                        )}
                                                        {r.status === 'Pendente' && userRole === 'GESTOR' && (
                                                            <button onClick={() => removerRota(r.id)} className="text-red-500 text-xs font-bold underline">Cancelar Rota</button>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}
                                
                                {/* VIEW: O.S. (Operacional e Gestor) */}
                                {view === 'os' && !isGlobal && (
                                    <div className="bg-white p-1 animate-fade-in">
                                        <h2 className="text-xl font-bold text-slate-800 mb-4">🔧 Formulário O.S.</h2>
                                        <div className="space-y-3">
                                            {/* Campos O.S. simplificados */}
                                            <input type="date" className="w-full border p-3 rounded-xl bg-slate-50" value={novaDespesa.data} onChange={e => setNovaDespesa({...novaDespesa, data: e.target.value})} />
                                            <input type="number" className="w-full border p-3 rounded-xl" placeholder={`KM do Veículo (Atual: ${kmAtualNum})`} value={novaDespesa.km} onChange={e => setNovaDespesa({...novaDespesa, km: e.target.value})} />
                                            <textarea rows="2" className="w-full border p-3 rounded-xl outline-none" placeholder="Descrição do Serviço realizado..." value={novaDespesa.descricao} onChange={e => setNovaDespesa({...novaDespesa, descricao: e.target.value})}></textarea>
                                            
                                            {/* Secção Financeira */}
                                            <div className="bg-slate-50 border p-3 rounded-xl mt-2">
                                                <div className="grid grid-cols-2 gap-2">
                                                    <input type="number" className="w-full border p-2 rounded-lg text-sm bg-white" placeholder="Mão de Obra (€)" value={novaDespesa.valorMaoObra} onChange={e=>setNovaDespesa({...novaDespesa, valorMaoObra: e.target.value})} />
                                                    <input type="number" className="w-full border p-2 rounded-lg text-sm bg-white" placeholder="Peças (€)" value={novaDespesa.valorPecas} onChange={e=>setNovaDespesa({...novaDespesa, valorPecas: e.target.value})} />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                        
                        {/* MENU INFERIOR - 5 BOTÕES GESTOR / 2 BOTÕES OPERACIONAL */}
                        {!showCadastro && veiculos.length > 0 && (
                            <div className="fixed md:absolute bottom-0 left-0 w-full bg-white border-t border-slate-200 px-1 py-2 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-50 overflow-x-auto hide-scroll">
                                {userRole === 'GESTOR' ? (
                                    <div className="flex justify-between items-center min-w-full gap-1">
                                        <button onClick={() => setView('dashboard')} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'dashboard' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">🏠</span><span className="text-[9px] font-bold uppercase">Painel</span>
                                        </button>
                                        <button onClick={() => setView('rotas')} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'rotas' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">🗺️</span><span className="text-[9px] font-bold uppercase">Rotas</span>
                                        </button>
                                        <button onClick={() => setView('os')} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'os' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">🔧</span><span className="text-[9px] font-bold uppercase">O.S.</span>
                                        </button>
                                    </div>
                                ) : (
                                    <div className="flex justify-center items-center min-w-full gap-2 px-2">
                                        <button onClick={() => { setView('rotas'); setExecucaoRota(null); }} className={`w-1/2 flex flex-col items-center justify-center p-2 rounded-xl transition-colors border ${view === 'rotas' ? 'text-blue-700 bg-blue-50 border-blue-200' : 'text-slate-500 border-transparent'}`}>
                                            <span className="text-2xl mb-1">🗺️</span><span className="text-xs font-bold uppercase tracking-tighter">Viagens</span>
                                        </button>
                                        <button onClick={() => setView('os')} className={`w-1/2 flex flex-col items-center justify-center p-2 rounded-xl transition-colors border ${view === 'os' ? 'text-blue-700 bg-blue-50 border-blue-200' : 'text-slate-500 border-transparent'}`}>
                                            <span className="text-2xl mb-1">🔧</span><span className="text-xs font-bold uppercase tracking-tighter">Registar O.S.</span>
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ControleFrotaMulti />);
    </script>
</body>
</html>
