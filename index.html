<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUBI FROTA - Gestão Inteligente</title>
    <!-- Bibliotecas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    
    <style>
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease forwards; }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // URL DA SUA API GOOGLE SHEETS
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7N4C1lZperjJZiDlk_SPDEl4OlfvuvbjdePeWKa-qr2ojbu4kmL862ntMjjcZNPrPQQ/exec';

        function ControleFrotaMulti() {
            // ESTADOS DA APLICAÇÃO
            const [userRole, setUserRole] = useState(null); 
            const [veiculos, setVeiculos] = useState([]);
            const [veiculoAtivo, setVeiculoAtivo] = useState('TODOS'); 
            const [despesas, setDespesas] = useState([]);
            const [lembretes, setLembretes] = useState([]);
            const [rotas, setRotas] = useState([]);
            
            const [view, setView] = useState('dashboard');
            const [showCadastro, setShowCadastro] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [formError, setFormError] = useState('');
            const [syncStatus, setSyncStatus] = useState('☁️ A conectar...');
            const [editingDespesaIndex, setEditingDespesaIndex] = useState(null);
            
            const [isUploading, setIsUploading] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');

            const [novoVeiculo, setNovoVeiculo] = useState({ veiculo: '', placa: '', motorista: '', centroCusto: '', kmAtual: '' });

            const defaultDespesa = {
                categoria: 'Mecânica / Manutenção', data: new Date().toISOString().split('T')[0], 
                valor: '', valorMaoObra: '', valorPecas: '', situacao: 'Concluída',
                km: '', fornecedor: '', nf: '', descricao: '', pecas: '',
                litros: '', precoLitro: '',
                tipoOS: 'Corretiva', localOS: 'Externa', anexos: []
            };

            const [novaDespesa, setNovaDespesa] = useState(defaultDespesa);

            const [novoLembrete, setNovoLembrete] = useState({
                tipo: 'Troca de Óleo e Filtro', freqKm: '', freqMeses: '', ultimoKm: '', ultimaData: new Date().toISOString().split('T')[0]
            });

            const [novaRotaGestor, setNovaRotaGestor] = useState({ origem: '', destino: '', observacoes: '' });
            const [execucaoRota, setExecucaoRota] = useState(null);

            // CARREGAMENTO INICIAL
            useEffect(() => {
                const savedRole = localStorage.getItem('rubi_frota_role');
                if (savedRole) {
                    setUserRole(savedRole);
                    if (savedRole === 'OPERACIONAL') setView('rotas');
                }
                carregarDaNuvem();
            }, []);

            // VERIFICAÇÃO DE RASCUNHOS
            useEffect(() => {
                if ((view === 'os' || view === 'abastecimento') && editingDespesaIndex === null && veiculoAtivo !== 'TODOS') {
                    const rascunhoStr = localStorage.getItem('rubi_frota_rascunho_despesa');
                    if (rascunhoStr) {
                        const parsed = JSON.parse(rascunhoStr);
                        if (parsed.view === view && parsed.veiculo === veiculoAtivo) setNovaDespesa(parsed.despesa);
                    }
                }
            }, [view, veiculoAtivo, editingDespesaIndex]);

            // FUNÇÕES DE NUVEM E BACKUP
            const carregarDaNuvem = async () => {
                setSyncStatus('⏳ A puxar...');
                try {
                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'carregar' }) });
                    const result = await response.json();
                    if (result.status === 'sucesso') {
                        if (result.dados.veiculos) setVeiculos(result.dados.veiculos);
                        if (result.dados.despesas) setDespesas(result.dados.despesas);
                        if (result.dados.lembretes) setLembretes(result.dados.lembretes);
                        if (result.dados.rotas) setRotas(result.dados.rotas);
                        setSyncStatus('☁️ OK');
                        localStorage.setItem('rubi_frota_db', JSON.stringify(result.dados));
                    }
                } catch (error) {
                    setSyncStatus('⚠️ Offline');
                    const saved = localStorage.getItem('rubi_frota_db');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed.veiculos) setVeiculos(parsed.veiculos);
                        if (parsed.despesas) setDespesas(parsed.despesas);
                        if (parsed.lembretes) setLembretes(parsed.lembretes);
                        if (parsed.rotas) setRotas(parsed.rotas);
                    }
                }
            };

            const salvarNaNuvem = async (veics, desps, lembs, rots) => {
                setSyncStatus('⏳ A guardar...');
                localStorage.setItem('rubi_frota_db', JSON.stringify({ veiculos: veics, despesas: desps, lembretes: lembs, rotas: rots }));
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'sincronizar', veiculos: veics, despesas: desps, lembretes: lembs, rotas: rots })
                    });
                    const result = await response.json();
                    if (result.status === 'sucesso') setSyncStatus('☁️ OK');
                    else setSyncStatus('⚠️ Erro Sync');
                } catch (error) {
                    setSyncStatus('⚠️ Offline');
                }
            };

            const exportarBackup = () => {
                const dados = { veiculos, despesas, lembretes, rotas };
                const blob = new Blob([JSON.stringify(dados)], {type: "application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Backup_RUBI_FROTA_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            };

            const importarBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.veiculos) setVeiculos(parsed.veiculos);
                        if (parsed.despesas) setDespesas(parsed.despesas);
                        if (parsed.lembretes) setLembretes(parsed.lembretes);
                        if (parsed.rotas) setRotas(parsed.rotas);
                        salvarNaNuvem(parsed.veiculos || [], parsed.despesas || [], parsed.lembretes || [], parsed.rotas || []);
                        alert("✅ Backup restaurado com sucesso!");
                    } catch(err) {
                        alert("❌ Arquivo de backup inválido!");
                    }
                };
                reader.readAsText(file);
            };

            // ECRÃ DE LOGIN
            if (!userRole) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 p-6 animate-fade-in">
                        <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>
                            <h1 className="text-4xl font-black tracking-tight text-blue-600 mb-1 mt-4">RUBI<span className="text-slate-800 font-light">FROTA</span></h1>
                            <p className="text-slate-500 text-sm mb-10">Selecione o seu perfil de acesso</p>
                            <div className="space-y-4">
                                <button onClick={() => {
                                    const pin = prompt("Digite a senha do Gestor (A senha padrão é 1234):");
                                    if (pin === '1234') { setUserRole('GESTOR'); localStorage.setItem('rubi_frota_role', 'GESTOR'); setView('dashboard'); } 
                                    else if (pin !== null) alert('Senha incorreta!');
                                }} className="w-full bg-slate-800 text-white font-bold p-4 rounded-2xl hover:bg-slate-900 transition flex items-center justify-center gap-3 shadow-md">
                                    <span className="text-2xl">👔</span> <span>Acesso Gestor</span>
                                </button>
                                <button onClick={() => {
                                    setUserRole('OPERACIONAL'); localStorage.setItem('rubi_frota_role', 'OPERACIONAL'); setView('rotas');
                                }} className="w-full bg-blue-50 text-blue-700 font-bold p-4 rounded-2xl border border-blue-200 hover:bg-blue-100 transition flex items-center justify-center gap-3">
                                    <span className="text-2xl">🚛</span> <span>Acesso Operacional</span>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // VARIÁVEIS COMPUTADAS E FILTROS
            const isGlobal = veiculoAtivo === 'TODOS';
            const veiculoAtual = isGlobal ? null : veiculos.find(v => v.placa === veiculoAtivo);
            const kmAtualNum = veiculoAtual ? parseFloat(veiculoAtual.kmAtual) || 0 : 0;
            
            const despesasIniciais = isGlobal ? despesas.slice().reverse() : despesas.filter(d => d.placa === veiculoAtivo).reverse();
            
            // Barra de Pesquisa Aplicada ao Histórico
            const despesasFiltradas = despesasIniciais.filter(d => 
                (d.categoria && d.categoria.toLowerCase().includes(searchTerm.toLowerCase())) || 
                (d.fornecedor && d.fornecedor.toLowerCase().includes(searchTerm.toLowerCase())) ||
                (d.descricao && d.descricao.toLowerCase().includes(searchTerm.toLowerCase())) ||
                (d.placa && d.placa.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            const lembretesFiltrados = isGlobal ? lembretes : lembretes.filter(l => l.placa === veiculoAtivo);
            const rotasFiltradas = isGlobal ? rotas.slice().reverse() : rotas.filter(r => r.placa === veiculoAtivo).reverse();
            const totalGasto = despesasIniciais.reduce((acc, curr) => acc + (parseFloat(curr.valor) || 0), 0);

            const formatCurrency = (val) => isNaN(parseFloat(val)) ? 'R$ 0,00' : parseFloat(val).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            const getKmAtual = (placa) => {
                const v = veiculos.find(ve => ve.placa === placa);
                return v ? parseFloat(v.kmAtual) || 0 : 0;
            };

            const atualizarKmVeiculo = (novoKmInformado, placaVeiculo) => {
                const novoKm = parseFloat(novoKmInformado);
                const veiculoAlvo = veiculos.find(v => v.placa === placaVeiculo);
                if (veiculoAlvo && novoKm > (parseFloat(veiculoAlvo.kmAtual) || 0)) {
                    return veiculos.map(v => v.placa === placaVeiculo ? { ...v, kmAtual: novoKm } : v);
                }
                return veiculos;
            };

            // FUNÇÕES DE AÇÃO PRINCIPAIS
            const handleAddVeiculo = () => {
                if (!novoVeiculo.veiculo || !novoVeiculo.placa) return alert('Veículo e Matrícula/Placa são obrigatórios!');
                const placaUpper = novoVeiculo.placa.toUpperCase();
                if (veiculos.find(v => v.placa === placaUpper)) return alert('Matrícula já registada!');
                const novosVeiculos = [...veiculos, { ...novoVeiculo, placa: placaUpper }];
                setVeiculos(novosVeiculos);
                salvarNaNuvem(novosVeiculos, despesas, lembretes, rotas);
                setVeiculoAtivo(placaUpper);
                setNovoVeiculo({ veiculo: '', placa: '', motorista: '', centroCusto: '', kmAtual: '' });
                setShowCadastro(false);
                setView('dashboard');
            };

            const removerVeiculo = () => {
                if(confirm("ATENÇÃO: Deseja excluir esta viatura permanentemente?")) {
                    const novosVeiculos = veiculos.filter(v => v.placa !== veiculoAtivo);
                    setVeiculos(novosVeiculos);
                    salvarNaNuvem(novosVeiculos, despesas, lembretes, rotas);
                    setVeiculoAtivo('TODOS');
                    setView('dashboard');
                }
            };

            const handleSalvarRascunhoDespesa = () => {
                localStorage.setItem('rubi_frota_rascunho_despesa', JSON.stringify({ view: view, veiculo: veiculoAtivo, despesa: novaDespesa }));
                alert('💾 Rascunho salvo com sucesso!');
            };

            const handleAddDespesa = () => {
                if (isGlobal) return alert('Selecione uma viatura específica.');
                let valorFinal = novaDespesa.valor;
                
                let descricaoFinal = novaDespesa.descricao;
                if (view === 'abastecimento') {
                    if (novaDespesa.litros && novaDespesa.precoLitro) {
                        const resumo = `[${novaDespesa.litros}L a R$${novaDespesa.precoLitro}/L]`;
                        descricaoFinal = descricaoFinal ? `${resumo} ${descricaoFinal}` : resumo;
                    }
                }

                if (view === 'os') {
                    const totalOS = (parseFloat(novaDespesa.valorMaoObra) || 0) + (parseFloat(novaDespesa.valorPecas) || 0);
                    if (totalOS <= 0 && novaDespesa.situacao === 'Concluída' && userRole === 'GESTOR') return setFormError('Informe os valores para O.S. Concluída.');
                    valorFinal = totalOS > 0 ? totalOS.toFixed(2) : '0.00';
                }
                
                if (!novaDespesa.data) return setFormError('A data é obrigatória.');
                setFormError('');

                let novosVeiculos = veiculos;
                if (novaDespesa.km) {
                    novosVeiculos = atualizarKmVeiculo(novaDespesa.km, veiculoAtivo);
                    setVeiculos(novosVeiculos);
                }

                let novasDespesas = [...despesas];
                const registoPronto = { ...novaDespesa, valor: valorFinal, descricao: descricaoFinal, placa: veiculoAtivo };
                
                if (editingDespesaIndex !== null) {
                    novasDespesas[editingDespesaIndex] = registoPronto;
                    alert('✅ Registo atualizado!');
                } else {
                    novasDespesas = [...despesas, registoPronto];
                    alert('✅ Registo guardado com sucesso!');
                }

                setDespesas(novasDespesas);
                salvarNaNuvem(novosVeiculos, novasDespesas, lembretes, rotas);
                localStorage.removeItem('rubi_frota_rascunho_despesa');
                setEditingDespesaIndex(null);
                setNovaDespesa(defaultDespesa);
                if(userRole === 'GESTOR') setView('historico');
            };

            const handleEditDespesa = (despesa) => {
                const indexReal = despesas.indexOf(despesa);
                setEditingDespesaIndex(indexReal);
                setNovaDespesa(despesa);
                setView(despesa.categoria === 'Abastecimento' ? 'abastecimento' : 'os');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const removerDespesa = (despesa) => {
                if(confirm("Deseja eliminar este registo?")) {
                    const novasDespesas = despesas.filter(d => d !== despesa);
                    setDespesas(novasDespesas);
                    salvarNaNuvem(veiculos, novasDespesas, lembretes, rotas);
                }
            };

            // UPLOAD PARA O GOOGLE DRIVE
            const handleImageUpload = async (e) => {
                const arquivos = Array.from(e.target.files);
                if (arquivos.length === 0) return;
                setIsUploading(true);
                setFormError('');

                const uploadPromises = arquivos.map(file => {
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = event => {
                            const isPDF = file.type === 'application/pdf';
                            
                            if (isPDF) {
                                const base64Data = event.target.result;
                                fetch(SCRIPT_URL, {
                                    method: 'POST',
                                    body: JSON.stringify({ action: 'upload_imagem', base64: base64Data, nomeArquivo: `DOC_${Date.now()}.pdf`, mimeType: 'application/pdf' })
                                }).then(res => res.json()).then(result => {
                                    if (result.status === 'sucesso') resolve(result.url); else reject();
                                }).catch(() => reject());
                            } else {
                                const img = new Image();
                                img.onload = async () => {
                                    const canvas = document.createElement('canvas');
                                    const ctx = canvas.getContext('2d');
                                    let w = img.width, h = img.height;
                                    if (w > 1200) { h *= 1200 / w; w = 1200; }
                                    canvas.width = w; canvas.height = h;
                                    ctx.drawImage(img, 0, 0, w, h);
                                    const base64Data = canvas.toDataURL('image/jpeg', 0.7);
                                    fetch(SCRIPT_URL, {
                                        method: 'POST',
                                        body: JSON.stringify({ action: 'upload_imagem', base64: base64Data, nomeArquivo: `FOTO_${Date.now()}.jpg`, mimeType: 'image/jpeg' })
                                    }).then(res => res.json()).then(result => {
                                        if (result.status === 'sucesso') resolve(result.url); else reject();
                                    }).catch(() => reject());
                                };
                                img.src = event.target.result;
                            }
                        };
                        reader.readAsDataURL(file);
                    });
                });

                try {
                    const uploadedUrls = await Promise.all(uploadPromises);
                    setNovaDespesa(prev => ({ ...prev, anexos: [...(prev.anexos || []), ...uploadedUrls] }));
                } catch (err) {
                    setFormError('Erro ao carregar ficheiro. Tente novamente.');
                } finally {
                    setIsUploading(false);
                }
            };

            // OUTRAS FUNÇÕES: Lembretes e Rotas
            const handleAddLembrete = () => {
                if (isGlobal) return alert('Selecione uma viatura específica.');
                if (!novoLembrete.freqKm && !novoLembrete.freqMeses) return alert('Indique a frequência em KM ou Meses.');
                const novosLembretes = [...lembretes, { ...novoLembrete, id: Date.now(), placa: veiculoAtivo }];
                setLembretes(novosLembretes);
                salvarNaNuvem(veiculos, despesas, novosLembretes, rotas);
                setNovoLembrete({ tipo: 'Troca de Óleo e Filtro', freqKm: '', freqMeses: '', ultimoKm: kmAtualNum || '', ultimaData: new Date().toISOString().split('T')[0] });
            };

            const removerLembrete = (id) => {
                if(confirm("Eliminar alerta?")) {
                    const novosLembretes = lembretes.filter(l => l.id !== id);
                    setLembretes(novosLembretes);
                    salvarNaNuvem(veiculos, despesas, novosLembretes, rotas);
                }
            };

            const handleCriarRota = () => {
                if(isGlobal) return alert('Selecione uma viatura para delegar a rota.');
                if(!novaRotaGestor.origem || !novaRotaGestor.destino) return alert('Origem e destino são obrigatórios.');
                const novaRota = {
                    id: Date.now(), placa: veiculoAtivo, status: 'Pendente',
                    origem: novaRotaGestor.origem, destino: novaRotaGestor.destino, observacoes: novaRotaGestor.observacoes,
                    data: '', motorista: '', ajudante1: '', ajudante2: '', kmInicial: '', kmFinal: ''
                };
                const novasRotas = [...rotas, novaRota];
                setRotas(novasRotas);
                salvarNaNuvem(veiculos, despesas, lembretes, novasRotas);
                setNovaRotaGestor({origem: '', destino: '', observacoes: ''});
                alert('Rota agendada!');
            };

            const iniciarExecucaoRota = (rota) => {
                const rascunhoStr = localStorage.getItem('rubi_frota_rascunho_rota');
                if (rascunhoStr) {
                    const parsed = JSON.parse(rascunhoStr);
                    if (parsed.id === rota.id) { setExecucaoRota(parsed); return; }
                }
                setExecucaoRota({ ...rota, data: new Date().toISOString().split('T')[0], kmInicial: kmAtualNum });
            };

            const handleSalvarRascunhoRota = () => {
                localStorage.setItem('rubi_frota_rascunho_rota', JSON.stringify(execucaoRota));
                alert('💾 Rascunho da viagem salvo!');
            };

            const handleConcluirRota = () => {
                if(!execucaoRota.data || !execucaoRota.kmInicial || !execucaoRota.kmFinal || !execucaoRota.motorista) {
                    return setFormError('Data, Motorista, KM Inicial e Final são obrigatórios.');
                }
                if(parseFloat(execucaoRota.kmFinal) <= parseFloat(execucaoRota.kmInicial)) {
                    return setFormError('O KM Final deve ser maior que o KM Inicial.');
                }
                setFormError('');

                const novosVeiculos = atualizarKmVeiculo(execucaoRota.kmFinal, veiculoAtivo);
                setVeiculos(novosVeiculos);
                const novasRotas = rotas.map(r => r.id === execucaoRota.id ? { ...r, status: 'Concluída', ...execucaoRota } : r);
                setRotas(novasRotas);
                salvarNaNuvem(novosVeiculos, despesas, lembretes, novasRotas);
                localStorage.removeItem('rubi_frota_rascunho_rota');
                setExecucaoRota(null);
                alert('✅ Viagem concluída com sucesso!');
            };

            const removerRota = (id) => {
                if(confirm("Deseja cancelar esta rota?")) {
                    const novasRotas = rotas.filter(r => r.id !== id);
                    setRotas(novasRotas);
                    salvarNaNuvem(veiculos, despesas, lembretes, novasRotas);
                }
            };

            const checkStatusLembrete = (lembrete) => {
                const kmDoVeiculoAlvo = getKmAtual(lembrete.placa);
                let status = { cor: 'bg-green-50 border-green-500 text-green-700', icone: '✅', msg: 'No Prazo', critico: false };
                if (lembrete.freqKm) {
                    const limiteKm = parseFloat(lembrete.ultimoKm) + parseFloat(lembrete.freqKm);
                    if (kmDoVeiculoAlvo >= limiteKm) return { cor: 'bg-red-50 border-red-500 text-red-700', icone: '🚨', msg: 'Vencido (KM)', critico: true };
                    else if (limiteKm - kmDoVeiculoAlvo <= 1000) status = { cor: 'bg-amber-50 border-amber-500 text-amber-700', icone: '⚠️', msg: 'Atenção: KM Próximo', critico: false };
                }
                if (lembrete.freqMeses && !status.critico) {
                    const dataLimite = new Date(lembrete.ultimaData);
                    dataLimite.setMonth(dataLimite.getMonth() + parseInt(lembrete.freqMeses));
                    const hoje = new Date();
                    if (hoje >= dataLimite) return { cor: 'bg-red-50 border-red-500 text-red-700', icone: '🚨', msg: 'Vencido (Prazo)', critico: true };
                    else {
                        const diffDias = (dataLimite - hoje) / (1000 * 60 * 60 * 24);
                        if (diffDias <= 15) status = { cor: 'bg-amber-50 border-amber-500 text-amber-700', icone: '📅', msg: 'Atenção: Prazo Próximo', critico: false };
                    }
                }
                return status;
            };

            const checkSaudeVeiculo = (placa) => {
                const lembretesDoVeiculo = lembretes.filter(l => l.placa === placa);
                if (lembretesDoVeiculo.length === 0) return 'OK';
                let temCritico = false;
                let temAviso = false;

                                            <div className="flex gap-2 pt-2 border-t border-slate-100">
                                                <button onClick={handleSalvarRascunhoDespesa} disabled={isUploading} className="w-1/2 bg-slate-100 border text-slate-600 font-bold p-3 rounded-xl text-sm">💾 Rascunho</button>
                                                <button onClick={handleAddDespesa} disabled={isUploading} className={`w-1/2 text-white font-bold p-3 rounded-xl shadow-lg text-sm ${isUploading ? 'bg-slate-400' : 'bg-blue-700'}`}>✅ Concluir</button>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* 4. ORDEM DE SERVIÇO (GESTOR E OPERACIONAL) */}
                                {view === 'os' && !isGlobal && (
                                    <div className="bg-white p-1 animate-fade-in">
                                        <div className="flex justify-between items-center mb-4">
                                            <h2 className="text-xl font-bold text-slate-800">{editingDespesaIndex !== null ? '✏️ Editar O.S.' : '🔧 Nova O.S.'}</h2>
                                            {editingDespesaIndex !== null && <button onClick={() => { setEditingDespesaIndex(null); setNovaDespesa(defaultDespesa); setView('historico'); }} className="text-xs bg-slate-200 text-slate-600 px-3 py-1 rounded-full font-bold">Cancelar</button>}
                                        </div>
                                        <div className="space-y-3">
                                            <select className="w-full bg-slate-50 p-3 rounded-xl font-bold text-slate-700 border" value={novaDespesa.categoria} onChange={e => setNovaDespesa({...novaDespesa, categoria: e.target.value})}>
                                                <option value="Mecânica / Manutenção">Manutenção Mecânica</option><option value="Troca de Óleo / Filtros">Troca de Óleo / Filtros</option><option value="Pneus / Borracharia">Pneus / Borracharia</option><option value="Lavagem / Estética">Lavagem / Estética</option>
                                            </select>
                                            <div className="grid grid-cols-3 gap-2">
                                                <select className="w-full border p-2 rounded-xl text-xs" value={novaDespesa.tipoOS} onChange={e=>setNovaDespesa({...novaDespesa, tipoOS: e.target.value})}><option value="Corretiva">Corretiva</option><option value="Preventiva">Preventiva</option></select>
                                                <select className="w-full border p-2 rounded-xl text-xs" value={novaDespesa.localOS} onChange={e=>setNovaDespesa({...novaDespesa, localOS: e.target.value})}><option value="Externa">Externa</option><option value="Interna">Interna</option></select>
                                                <select className="w-full border p-2 rounded-xl text-xs bg-slate-100" value={novaDespesa.situacao} onChange={e=>setNovaDespesa({...novaDespesa, situacao: e.target.value})}><option value="Orçamento">📝 Orçamento</option><option value="Em Andamento">⏳ Andamento</option><option value="Concluída">✅ Concluída</option></select>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <input type="date" className="w-full border p-3 rounded-xl bg-slate-50" value={novaDespesa.data} onChange={e => setNovaDespesa({...novaDespesa, data: e.target.value})} />
                                                <input type="number" className="w-full border p-3 rounded-xl" placeholder={`KM Atual`} value={novaDespesa.km} onChange={e => setNovaDespesa({...novaDespesa, km: e.target.value})} />
                                            </div>
                                            <input className="w-full border p-3 rounded-xl" placeholder="Oficina / Fornecedor" value={novaDespesa.fornecedor} onChange={e => setNovaDespesa({...novaDespesa, fornecedor: e.target.value})} />
                                            <textarea rows="2" className="w-full border p-3 rounded-xl outline-none" placeholder="Descrição do Serviço..." value={novaDespesa.descricao} onChange={e => setNovaDespesa({...novaDespesa, descricao: e.target.value})}></textarea>
                                            
                                            <div className="bg-slate-50 border p-3 rounded-xl mt-2">
                                                <h3 className="text-xs font-bold text-slate-500 uppercase mb-2">💳 Valores Financeiros</h3>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <input type="number" className="w-full border p-2 rounded-lg text-sm bg-white" placeholder="Mão de Obra (R$)" value={novaDespesa.valorMaoObra} onChange={e=>setNovaDespesa({...novaDespesa, valorMaoObra: e.target.value})} />
                                                    <input type="number" className="w-full border p-2 rounded-lg text-sm bg-white" placeholder="Peças (R$)" value={novaDespesa.valorPecas} onChange={e=>setNovaDespesa({...novaDespesa, valorPecas: e.target.value})} />
                                                </div>
                                            </div>
                                            
                                            <label className={`block bg-slate-50 border border-dashed p-4 rounded-xl text-center cursor-pointer ${isUploading ? 'border-amber-400' : 'border-slate-300'}`}>
                                                <span className={`text-sm font-bold ${isUploading ? 'text-amber-600' : 'text-slate-600'}`}>{isUploading ? '⏳ Upload...' : '📸 Anexar O.S. ou PDF'}</span>
                                                <input type="file" accept="image/*,application/pdf" multiple className="hidden" disabled={isUploading} onChange={handleImageUpload} />
                                            </label>
                                            
                                            <div className="flex gap-2 pt-2 border-t border-slate-100">
                                                <button onClick={handleSalvarRascunhoDespesa} disabled={isUploading} className="w-1/2 bg-slate-100 border text-slate-600 font-bold p-3 rounded-xl text-sm">💾 Rascunho</button>
                                                <button onClick={handleAddDespesa} disabled={isUploading} className={`w-1/2 text-white font-bold p-3 rounded-xl shadow-lg text-sm ${isUploading ? 'bg-slate-400' : 'bg-slate-800'}`}>✅ Concluir</button>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* 5. LEMBRETES CONFIGURAÇÃO (SÓ GESTOR) */}
                                {view === 'lembretes' && !isGlobal && userRole === 'GESTOR' && (
                                    <div className="animate-fade-in space-y-4">
                                        <h2 className="text-xl font-bold text-slate-800">🔔 Configurar Alertas</h2>
                                        <div className="bg-blue-50 p-4 rounded-2xl border border-blue-100 space-y-3">
                                            <input className="w-full border p-2 rounded-xl text-sm" placeholder="Componente (Ex: Bateria, Óleo)" value={novoLembrete.tipo} onChange={e => setNovoLembrete({...novoLembrete, tipo: e.target.value})} list="opcoes-manutencao" />
                                            <datalist id="opcoes-manutencao"><option value="Troca de Óleo" /><option value="Bateria" /><option value="Seguro" /></datalist>
                                            <div className="grid grid-cols-2 gap-2 pt-2">
                                                <input type="number" className="w-full border p-2 rounded-lg text-sm" placeholder="Freq. KM" value={novoLembrete.freqKm} onChange={e => setNovoLembrete({...novoLembrete, freqKm: e.target.value})} />
                                                <select className="w-full border p-2 rounded-lg text-sm bg-white" value={novoLembrete.freqMeses} onChange={e => setNovoLembrete({...novoLembrete, freqMeses: e.target.value})}>
                                                    <option value="">Apenas KM...</option><option value="3">3 meses</option><option value="12">12 meses</option>
                                                </select>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2 bg-white p-2 rounded-xl">
                                                <input type="number" className="w-full border p-2 rounded-lg text-sm bg-slate-50" placeholder="Último KM" value={novoLembrete.ultimoKm} onChange={e => setNovoLembrete({...novoLembrete, ultimoKm: e.target.value})} />
                                                <input type="date" className="w-full border p-2 rounded-lg text-sm bg-slate-50" value={novoLembrete.ultimaData} onChange={e => setNovoLembrete({...novoLembrete, ultimaData: e.target.value})} />
                                            </div>
                                            <button onClick={handleAddLembrete} className="w-full bg-blue-700 text-white font-bold p-3 rounded-xl text-sm">Guardar Alerta</button>
                                        </div>
                                        <div className="space-y-2">
                                            {lembretesFiltrados.map(l => (
                                                <div key={l.id} className="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm">
                                                    <div><p className="font-bold text-sm text-slate-800">{l.tipo}</p></div>
                                                    <button onClick={() => removerLembrete(l.id)} className="text-red-600 text-xs font-bold underline">Excluir</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* 6. HISTÓRICO COM PESQUISA (SÓ GESTOR) */}
                                {view === 'historico' && userRole === 'GESTOR' && (
                                    <div className="animate-fade-in space-y-4">
                                        <div className="flex justify-between items-center">
                                            <h2 className="text-xl font-bold text-slate-800">🧾 Histórico</h2>
                                            <button onClick={generatePDF} disabled={isGenerating || despesasFiltradas.length === 0} className="bg-slate-800 text-white text-xs font-bold px-3 py-2 rounded-lg shadow">{isGenerating ? 'A exportar...' : 'Exportar PDF'}</button>
                                        </div>

                                        <div className="relative">
                                            <span className="absolute left-3 top-3 text-slate-400">🔍</span>
                                            <input type="text" className="w-full bg-white border border-slate-300 rounded-xl py-3 pl-10 pr-4 text-sm font-bold shadow-sm outline-none" placeholder="Pesquisar categoria, placa ou descrição..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                                        </div>

                                        {despesasFiltradas.length === 0 ? <p className="text-center text-slate-400 py-10">Nenhum registo.</p> : (
                                            despesasFiltradas.map((d, i) => (
                                                <div key={i} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                                                    <div className="flex justify-between items-start mb-2 border-b border-slate-100 pb-2">
                                                        <div>
                                                            <span className="font-bold text-slate-800 uppercase block text-sm">{d.categoria} {isGlobal && <span className="bg-blue-100 text-blue-800 px-2 py-0.5 rounded">{d.placa}</span>}</span>
                                                            <span className="text-xs text-slate-500">{d.data} • KM: {d.km || '-'}</span>
                                                        </div>
                                                        <div className="text-right">
                                                            <span className="text-lg font-black text-blue-700 block">{formatCurrency(d.valor)}</span>
                                                        </div>
                                                    </div>
                                                    <div className="text-sm text-slate-600 space-y-1">
                                                        {d.fornecedor && <p>🏢 <strong>{d.fornecedor}</strong></p>}
                                                        {d.descricao && <p>🔧 {d.descricao}</p>}
                                                    </div>
                                                    <div className="flex justify-between items-center mt-3 pt-2 border-t border-slate-100">
                                                        {d.anexos && d.anexos.length > 0 ? (
                                                            <details className="text-sm">
                                                                <summary className="text-blue-700 font-bold bg-blue-50 px-3 py-1 rounded-lg border">📸 Ver {d.anexos.length} Anexo(s) ▾</summary>
                                                                <div className="flex flex-col gap-2 mt-2 p-2 bg-slate-50 rounded-lg">
                                                                    {d.anexos.map((url, idx) => (<a key={idx} href={url} target="_blank" className="text-blue-600 underline text-xs">🔗 Abrir Anexo {idx+1}</a>))}
                                                                </div>
                                                            </details>
                                                        ) : <div className="text-xs text-slate-300">Sem anexos</div>}
                                                        
                                                        <div className="flex gap-4">
                                                            <button onClick={() => handleEditDespesa(d)} className="text-amber-600 text-xs font-bold underline">Editar</button>
                                                            <button onClick={() => removerDespesa(d)} className="text-red-500 text-xs font-bold underline">Excluir</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* MENU INFERIOR */}
                        {!showCadastro && veiculos.length > 0 && (
                            <div className="fixed md:absolute bottom-0 left-0 w-full bg-white border-t border-slate-200 px-1 py-2 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-50 overflow-x-auto hide-scroll">
                                {userRole === 'GESTOR' ? (
                                    <div className="flex justify-between items-center min-w-full gap-1">
                                        <button onClick={() => { setView('dashboard'); setEditingDespesaIndex(null); }} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'dashboard' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">🏠</span><span className="text-[9px] font-bold uppercase">Painel</span>
                                        </button>
                                        <button onClick={() => { setView('rotas'); setEditingDespesaIndex(null); }} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'rotas' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">🗺️</span><span className="text-[9px] font-bold uppercase">Rotas</span>
                                        </button>
                                        <button onClick={() => { setView('abastecimento'); if(editingDespesaIndex === null) setNovaDespesa(defaultDespesa); }} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'abastecimento' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">⛽</span><span className="text-[9px] font-bold uppercase">Posto</span>
                                        </button>
                                        <button onClick={() => { setView('os'); if(editingDespesaIndex === null) setNovaDespesa(defaultDespesa); }} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'os' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">🔧</span><span className="text-[9px] font-bold uppercase">O.S.</span>
                                        </button>
                                        <button onClick={() => { setView('historico'); setEditingDespesaIndex(null); }} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'historico' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">🧾</span><span className="text-[9px] font-bold uppercase">Histórico</span>
                                        </button>
                                        <button onClick={() => { setView('lembretes'); setEditingDespesaIndex(null); }} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'lembretes' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">🔔</span><span className="text-[9px] font-bold uppercase">Alertas</span>
                                        </button>
                                    </div>
                                ) : (
                                    <div className="flex justify-center items-center min-w-full gap-2 px-2">
                                        <button onClick={() => { setView('rotas'); setExecucaoRota(null); }} className={`w-1/2 flex flex-col items-center justify-center p-2 rounded-xl transition-colors border ${view === 'rotas' ? 'text-blue-700 bg-blue-50 border-blue-200' : 'text-slate-500 border-transparent'}`}>
                                            <span className="text-2xl mb-1">🗺️</span><span className="text-xs font-bold uppercase">Viagens</span>
                                        </button>
                                        <button onClick={() => { setView('os'); setNovaDespesa(defaultDespesa); }} className={`w-1/2 flex flex-col items-center justify-center p-2 rounded-xl transition-colors border ${view === 'os' ? 'text-blue-700 bg-blue-50 border-blue-200' : 'text-slate-500 border-transparent'}`}>
                                            <span className="text-2xl mb-1">🔧</span><span className="text-xs font-bold uppercase">Registar O.S.</span>
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                    
                    <div id="pdf-content" style={{ display: 'none', width: '100%', backgroundColor: 'white', color: 'black', fontFamily: 'Arial', padding: '10px' }}>
                        <div className="bg-slate-800 text-white rounded-lg p-2 mb-3 text-center">
                            <h1 className="text-xl font-bold uppercase">{isGlobal ? 'Dossiê Consolidado RUBI FROTA' : 'Dossiê de Manutenção'}</h1>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ControleFrotaMulti />);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('✅ Service Worker registado!', reg))
                    .catch(err => console.error('❌ Erro no Service Worker', err));
            });
        }
    </script>
</body>
</html>
