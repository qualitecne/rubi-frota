<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUBI FROTA - Gestão Inteligente</title>
    <!-- Bibliotecas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    
    <style>
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // URL DA SUA API GOOGLE SHEETS
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7N4C1lZperjJZiDlk_SPDEl4OlfvuvbjdePeWKa-qr2ojbu4kmL862ntMjjcZNPrPQQ/exec';

        function ControleFrotaMulti() {
            const [veiculos, setVeiculos] = useState([]);
            const [veiculoAtivo, setVeiculoAtivo] = useState('TODOS'); 
            const [despesas, setDespesas] = useState([]);
            const [lembretes, setLembretes] = useState([]);
            
            const [view, setView] = useState('dashboard');
            const [showCadastro, setShowCadastro] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [formError, setFormError] = useState('');
            const [syncStatus, setSyncStatus] = useState('☁️ A conectar...');

            // Estado de Edição
            const [editingDespesaIndex, setEditingDespesaIndex] = useState(null);

            const [novoVeiculo, setNovoVeiculo] = useState({ 
                veiculo: '', placa: '', motorista: '', centroCusto: '', kmAtual: '' 
            });

            const defaultDespesa = {
                categoria: 'Mecânica / Manutenção', data: new Date().toISOString().split('T')[0], 
                valor: '', valorMaoObra: '', valorPecas: '', situacao: 'Concluída',
                km: '', fornecedor: '', nf: '', descricao: '', pecas: '',
                tipoOS: 'Corretiva', localOS: 'Externa', kmPercorrido: '', consumoKmLitro: '', precoCombustivel: '', anexos: []
            };

            const [novaDespesa, setNovaDespesa] = useState(defaultDespesa);

            const [novoLembrete, setNovoLembrete] = useState({
                tipo: 'Troca de Óleo e Filtro', freqKm: '', freqMeses: '', ultimoKm: '', ultimaData: new Date().toISOString().split('T')[0]
            });

            // CARREGAMENTO INICIAL
            useEffect(() => {
                carregarDaNuvem();
            }, []);

            // FUNÇÕES DE SINCRONIZAÇÃO EM NUVEM
            const carregarDaNuvem = async () => {
                setSyncStatus('⏳ A puxar dados...');
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'carregar' })
                    });
                    const result = await response.json();
                    
                    if (result.status === 'sucesso') {
                        if (result.dados.veiculos) setVeiculos(result.dados.veiculos);
                        if (result.dados.despesas) setDespesas(result.dados.despesas);
                        if (result.dados.lembretes) setLembretes(result.dados.lembretes);
                        setSyncStatus('☁️ OK');
                        localStorage.setItem('rubi_frota_db', JSON.stringify(result.dados));
                    }
                } catch (error) {
                    console.error("Erro na nuvem, a usar dados locais", error);
                    setSyncStatus('⚠️ Offline');
                    const saved = localStorage.getItem('rubi_frota_db');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed.veiculos) setVeiculos(parsed.veiculos);
                        if (parsed.despesas) setDespesas(parsed.despesas);
                        if (parsed.lembretes) setLembretes(parsed.lembretes);
                    }
                }
            };

            const salvarNaNuvem = async (veics, desps, lembs) => {
                setSyncStatus('⏳ A guardar...');
                localStorage.setItem('rubi_frota_db', JSON.stringify({ veiculos: veics, despesas: desps, lembretes: lembs }));
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'sincronizar', veiculos: veics, despesas: desps, lembretes: lembs })
                    });
                    const result = await response.json();
                    if (result.status === 'sucesso') {
                        setSyncStatus('☁️ OK');
                    } else {
                        setSyncStatus('⚠️ Erro Sync');
                    }
                } catch (error) {
                    setSyncStatus('⚠️ Offline');
                }
            };

            // LÓGICA DE DADOS
            const isGlobal = veiculoAtivo === 'TODOS';
            const veiculoAtual = isGlobal ? null : veiculos.find(v => v.placa === veiculoAtivo);
            
            const despesasFiltradas = isGlobal ? despesas.slice().reverse() : despesas.filter(d => d.placa === veiculoAtivo).reverse();
            const lembretesFiltrados = isGlobal ? lembretes : lembretes.filter(l => l.placa === veiculoAtivo);
            const totalGasto = despesasFiltradas.reduce((acc, curr) => acc + (parseFloat(curr.valor) || 0), 0);
            
            const getKmAtual = (placa) => {
                const v = veiculos.find(ve => ve.placa === placa);
                return v ? parseFloat(v.kmAtual) || 0 : 0;
            };

            const kmAtualNum = veiculoAtual ? parseFloat(veiculoAtual.kmAtual) || 0 : 0;

            const handleAddVeiculo = () => {
                if (!novoVeiculo.veiculo || !novoVeiculo.placa) return alert('Veículo e Matrícula/Placa são obrigatórios!');
                const placaUpper = novoVeiculo.placa.toUpperCase();
                if (veiculos.find(v => v.placa === placaUpper)) return alert('Matrícula já registada!');
                
                const novosVeiculos = [...veiculos, { ...novoVeiculo, placa: placaUpper }];
                setVeiculos(novosVeiculos);
                salvarNaNuvem(novosVeiculos, despesas, lembretes);
                
                setVeiculoAtivo(placaUpper);
                setNovoVeiculo({ veiculo: '', placa: '', motorista: '', centroCusto: '', kmAtual: '' });
                setShowCadastro(false);
                setView('dashboard');
            };

            const atualizarKmVeiculo = (novoKmInformado, placaVeiculo) => {
                const novoKm = parseFloat(novoKmInformado);
                const veiculoAlvo = veiculos.find(v => v.placa === placaVeiculo);
                if (veiculoAlvo && novoKm > (parseFloat(veiculoAlvo.kmAtual) || 0)) {
                    return veiculos.map(v => v.placa === placaVeiculo ? { ...v, kmAtual: novoKm } : v);
                }
                return veiculos;
            };

            const handleAddDespesa = () => {
                if (isGlobal) return alert('Selecione um veículo específico no topo para efetuar um registo.');
                
                let valorFinal = novaDespesa.valor;
                
                if (view === 'os') {
                    const totalOS = (parseFloat(novaDespesa.valorMaoObra) || 0) + (parseFloat(novaDespesa.valorPecas) || 0);
                    if (totalOS <= 0 && novaDespesa.situacao === 'Concluída') {
                        setFormError('Informe o valor da Mão de Obra ou das Peças para uma O.S. Concluída.');
                        return;
                    }
                    valorFinal = totalOS > 0 ? totalOS.toFixed(2) : '0.00';
                }

                if (!novaDespesa.data || (!valorFinal && view !== 'os')) {
                    setFormError('Data e Valor são obrigatórios.');
                    return;
                }
                setFormError('');

                let novosVeiculos = veiculos;
                if (novaDespesa.km) {
                    novosVeiculos = atualizarKmVeiculo(novaDespesa.km, veiculoAtivo);
                    setVeiculos(novosVeiculos);
                }

                let novasDespesas = [...despesas];
                
                if (editingDespesaIndex !== null) {
                    // Atualiza registo existente
                    novasDespesas[editingDespesaIndex] = { ...novaDespesa, valor: valorFinal, placa: veiculoAtivo };
                    alert('Registo atualizado com sucesso!');
                } else {
                    // Adiciona novo registo
                    novasDespesas = [...despesas, { ...novaDespesa, valor: valorFinal, placa: veiculoAtivo }];
                    alert('Registo guardado com sucesso!');
                }

                setDespesas(novasDespesas);
                salvarNaNuvem(novosVeiculos, novasDespesas, lembretes);
                
                setEditingDespesaIndex(null);
                setNovaDespesa(defaultDespesa);
                setView('historico');
            };

            const handleEditDespesa = (despesa) => {
                // Encontra o índice real no array original
                const indexReal = despesas.indexOf(despesa);
                setEditingDespesaIndex(indexReal);
                setNovaDespesa(despesa);
                if (despesa.categoria === 'Abastecimento') {
                    setView('abastecimento');
                } else {
                    setView('os');
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const cancelarEdicao = () => {
                setEditingDespesaIndex(null);
                setNovaDespesa(defaultDespesa);
                setView('historico');
            };

            const handleAddLembrete = () => {
                if (isGlobal) return alert('Selecione um veículo específico no topo para criar um lembrete.');
                if (!novoLembrete.freqKm && !novoLembrete.freqMeses) return alert('Indique pelo menos a frequência em KM ou em Meses.');
                
                const novosLembretes = [...lembretes, { ...novoLembrete, id: Date.now(), placa: veiculoAtivo }];
                setLembretes(novosLembretes);
                salvarNaNuvem(veiculos, despesas, novosLembretes);
                
                setNovoLembrete({
                    tipo: 'Troca de Óleo e Filtro', freqKm: '', freqMeses: '', ultimoKm: kmAtualNum || '', ultimaData: new Date().toISOString().split('T')[0]
                });
            };

            const removerDespesa = (despesa) => {
                if(confirm("Tem a certeza que deseja eliminar este registo?")) {
                    const novasDespesas = despesas.filter(d => d !== despesa);
                    setDespesas(novasDespesas);
                    salvarNaNuvem(veiculos, novasDespesas, lembretes);
                }
            };

            const removerLembrete = (id) => {
                if(confirm("Eliminar este lembrete?")) {
                    const novosLembretes = lembretes.filter(l => l.id !== id);
                    setLembretes(novosLembretes);
                    salvarNaNuvem(veiculos, despesas, novosLembretes);
                }
            };

            const checkStatusLembrete = (lembrete) => {
                const kmDoVeiculoAlvo = getKmAtual(lembrete.placa);
                let status = { cor: 'bg-green-50 border-green-500 text-green-700', icone: '✅', msg: 'No Prazo', critico: false };
                
                if (lembrete.freqKm) {
                    const limiteKm = parseFloat(lembrete.ultimoKm) + parseFloat(lembrete.freqKm);
                    if (kmDoVeiculoAlvo >= limiteKm) {
                        return { cor: 'bg-red-50 border-red-500 text-red-700', icone: '🚨', msg: 'Vencido (KM)', critico: true };
                    } else if (limiteKm - kmDoVeiculoAlvo <= 1000) {
                        status = { cor: 'bg-amber-50 border-amber-500 text-amber-700', icone: '⚠️', msg: 'Atenção: KM Próxima', critico: false };
                    }
                }

                if (lembrete.freqMeses && !status.critico) {
                    const dataLimite = new Date(lembrete.ultimaData);
                    dataLimite.setMonth(dataLimite.getMonth() + parseInt(lembrete.freqMeses));
                    const hoje = new Date();
                    
                    if (hoje >= dataLimite) {
                        return { cor: 'bg-red-50 border-red-500 text-red-700', icone: '🚨', msg: 'Vencido (Prazo)', critico: true };
                    } else {
                        const diffDias = (dataLimite - hoje) / (1000 * 60 * 60 * 24);
                        if (diffDias <= 15) {
                            status = { cor: 'bg-amber-50 border-amber-500 text-amber-700', icone: '📅', msg: 'Atenção: Prazo Próximo', critico: false };
                        }
                    }
                }
                return status;
            };

            const checkSaudeVeiculo = (placa) => {
                const lembretesDoVeiculo = lembretes.filter(l => l.placa === placa);
                if (lembretesDoVeiculo.length === 0) return 'OK';
                
                let temCritico = false;
                let temAviso = false;
                
                lembretesDoVeiculo.forEach(l => {
                    const status = checkStatusLembrete(l);
                    if (status.critico) temCritico = true;
                    if (status.icone === '⚠️' || status.icone === '📅') temAviso = true;
                });
                
                if (temCritico) return 'CRITICO';
                if (temAviso) return 'AVISO';
                return 'OK';
            };

            const formatCurrency = (val) => isNaN(parseFloat(val)) ? 'R$ 0,00' : parseFloat(val).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            const getCorSituacao = (sit) => {
                if (sit === 'Orçamento') return 'bg-amber-100 text-amber-800';
                if (sit === 'Em Andamento') return 'bg-blue-100 text-blue-800';
                return 'bg-green-100 text-green-800'; 
            };

            const getIconeSituacao = (sit) => {
                if (sit === 'Orçamento') return '📝';
                if (sit === 'Em Andamento') return '⏳';
                return '✅'; 
            };

            const handleImageUpload = (e) => {
                const arquivos = Array.from(e.target.files);
                arquivos.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = event => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            let w = img.width, h = img.height;
                            if (w > 1200) { h *= 1200 / w; w = 1200; }
                            canvas.width = w; canvas.height = h;
                            ctx.drawImage(img, 0, 0, w, h);
                            setNovaDespesa(prev => ({ ...prev, anexos: [...(prev.anexos || []), canvas.toDataURL('image/jpeg', 0.7)] }));
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const generatePDF = () => {
                setIsGenerating(true);
                const mainUi = document.getElementById('main-ui');
                const pdfContent = document.getElementById('pdf-content');
                mainUi.style.display = 'none';
                pdfContent.style.display = 'block';
                window.scrollTo(0, 0);
                
                const filename = isGlobal ? `Relatorio_RUBI_FROTA_Global.pdf` : `Dossie_${veiculoAtual.placa}.pdf`;
                
                const opt = {
                    margin: [5, 5, 10, 5],
                    filename: filename,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, scrollY: 0 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                
                window.html2pdf().set(opt).from(pdfContent).save().then(() => {
                    mainUi.style.display = 'block';
                    pdfContent.style.display = 'none';
                    setIsGenerating(false);
                }).catch(() => setIsGenerating(false));
            };

            return (
                <div className="min-h-screen font-sans text-slate-800 pb-24 md:pb-10 max-w-md md:max-w-4xl mx-auto md:mt-4 shadow-xl bg-white md:rounded-3xl overflow-hidden relative border border-slate-200">
                    
                    <div id="main-ui">
                        {/* CABEÇALHO GLOBAL */}
                        <div className="bg-slate-900 text-white p-5 rounded-b-3xl md:rounded-t-3xl md:rounded-b-none shadow-md">
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex items-center gap-3">
                                    <h1 className="text-2xl font-black tracking-tight text-blue-400">RUBI<span className="text-white font-light">FROTA</span></h1>
                                    <button onClick={carregarDaNuvem} className="bg-slate-800 border border-slate-700 text-[10px] font-bold px-2 py-1 rounded-lg text-slate-300 hover:bg-slate-700 transition" title="Sincronizar Nuvem">
                                        {syncStatus}
                                    </button>
                                </div>
                                <button onClick={() => setShowCadastro(!showCadastro)} className="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-full font-bold border border-slate-700 transition">
                                    {showCadastro ? 'Cancelar' : '+ Veículo'}
                                </button>
                            </div>
                            
                            {!showCadastro && veiculos.length > 0 && (
                                <div className="bg-slate-800 rounded-2xl p-2 flex items-center border border-slate-700 focus-within:ring-2 focus-within:ring-blue-500">
                                    <span className="pl-3 text-slate-400 text-xl">{isGlobal ? '🌐' : '🚘'}</span>
                                    <select className="w-full p-2 bg-transparent text-white font-bold outline-none appearance-none" 
                                            value={veiculoAtivo} onChange={e => { setVeiculoAtivo(e.target.value); setView('dashboard'); setEditingDespesaIndex(null); }}>
                                        <option value="TODOS" className="text-slate-900 font-bold bg-slate-100">🌐 VISÃO GLOBAL (Toda a Frota)</option>
                                        {veiculos.map((v, i) => <option key={i} value={v.placa} className="text-slate-900">{v.placa} - {v.veiculo}</option>)}
                                    </select>
                                </div>
                            )}
                        </div>

                        {/* CADASTRO DE VEÍCULO */}
                        {showCadastro && (
                            <div className="p-5 animate-fade-in space-y-4">
                                <h2 className="font-bold text-lg text-slate-800">Registar Novo Veículo</h2>
                                <input className="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-400" placeholder="Marca / Modelo" value={novoVeiculo.veiculo} onChange={e => setNovoVeiculo({...novoVeiculo, veiculo: e.target.value})} />
                                <input className="w-full border p-3 rounded-xl outline-none focus:ring-2 focus:ring-blue-400 uppercase" placeholder="Matrícula / Placa" value={novoVeiculo.placa} onChange={e => setNovoVeiculo({...novoVeiculo, placa: e.target.value})} />
                                <input type="number" className="w-full border p-3 rounded-xl outline-none" placeholder="KM Inicial (Odómetro)" value={novoVeiculo.kmAtual} onChange={e => setNovoVeiculo({...novoVeiculo, kmAtual: e.target.value})} />
                                <input className="w-full border p-3 rounded-xl outline-none" placeholder="Motorista Principal" value={novoVeiculo.motorista} onChange={e => setNovoVeiculo({...novoVeiculo, motorista: e.target.value})} />
                                <button onClick={handleAddVeiculo} className="w-full bg-blue-700 text-white font-bold p-4 rounded-xl shadow-lg hover:bg-blue-800 transition">Guardar Veículo</button>
                            </div>
                        )}

                        {/* MENSAGEM DE BLOQUEIO NA VISÃO GLOBAL */}
                        {!showCadastro && isGlobal && (view === 'abastecimento' || view === 'os' || view === 'lembretes') && veiculos.length > 0 && (
                            <div className="p-10 text-center text-slate-500 animate-fade-in mt-10">
                                <span className="text-5xl block mb-4 opacity-50">🔒</span>
                                <h2 className="font-bold text-xl text-slate-700 mb-2">Ação Não Permitida</h2>
                                <p className="text-sm">Para registar abastecimentos, ordens de serviço ou criar alertas, selecione um veículo específico no menu superior.</p>
                                <button onClick={() => setView('dashboard')} className="mt-6 text-blue-600 font-bold border border-blue-600 px-4 py-2 rounded-lg">Voltar ao Painel</button>
                            </div>
                        )}

                        {/* CONTEÚDO PRINCIPAL DAS VIEWS */}
                        {!showCadastro && veiculos.length > 0 && ((!isGlobal) || (isGlobal && (view === 'dashboard' || view === 'historico'))) && (
                            <div className="p-4 space-y-4 mb-16">
                                
                                {/* VIEW: DASHBOARD */}
                                {view === 'dashboard' && (
                                    <div className="animate-fade-in space-y-4">
                                        <div className="bg-slate-800 text-white p-4 rounded-2xl shadow-sm flex flex-col gap-3">
                                            <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                                                <div>
                                                    <h2 className="font-bold text-lg">{isGlobal ? 'Visão Global da Empresa' : veiculoAtual.veiculo}</h2>
                                                    <p className="text-xs text-slate-400">{isGlobal ? `${veiculos.length} veículos ativos` : `Placa: ${veiculoAtual.placa}`}</p>
                                                </div>
                                                <span className="text-3xl">{isGlobal ? '🏢' : '🚘'}</span>
                                            </div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <div>
                                                    <p className="text-[10px] text-slate-400 font-bold uppercase mb-0.5">Custo Total</p>
                                                    <p className="text-xl font-black text-blue-400">{formatCurrency(totalGasto)}</p>
                                                </div>
                                                <div>
                                                    <p className="text-[10px] text-slate-400 font-bold uppercase mb-0.5">{isGlobal ? 'Intervenções' : 'KM Atual'}</p>
                                                    <p className="text-xl font-black text-white">{isGlobal ? `${despesasFiltradas.length} Registros` : kmAtualNum.toLocaleString()}</p>
                                                </div>
                                            </div>
                                        </div>

                                        {isGlobal && (
                                            <div className="mt-6">
                                                <h3 className="font-bold text-slate-700 text-sm mb-3">Painel da Frota</h3>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                    {veiculos.map(v => {
                                                        const despVeiculo = despesas.filter(d => d.placa === v.placa);
                                                        const totalVeiculo = despVeiculo.reduce((acc, curr) => acc + (parseFloat(curr.valor) || 0), 0);
                                                        const kmV = parseFloat(v.kmAtual) || 0;
                                                        const custoPorKm = kmV > 0 ? (totalVeiculo / kmV).toFixed(2) : 0;
                                                        const saude = checkSaudeVeiculo(v.placa);
                                                        let indicadorCor = 'bg-green-500';
                                                        if (saude === 'CRITICO') indicadorCor = 'bg-red-500 animate-pulse';
                                                        if (saude === 'AVISO') indicadorCor = 'bg-amber-500';

                                                        return (
                                                            <div key={v.placa} className="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:border-blue-400 transition relative" 
                                                                 onClick={() => { setVeiculoAtivo(v.placa); setView('dashboard'); }}>
                                                                <div className={`absolute top-3 right-3 w-3 h-3 rounded-full ${indicadorCor} shadow-sm border border-white`} title={`Status Manutenção: ${saude}`}></div>
                                                                
                                                                <div className="flex items-center gap-3 mb-3 border-b border-slate-100 pb-2">
                                                                    <div className="bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center text-xl">🚘</div>
                                                                    <div>
                                                                        <h4 className="font-black text-slate-800 text-sm uppercase leading-tight">{v.placa}</h4>
                                                                        <p className="text-[10px] text-slate-500 font-bold uppercase truncate max-w-[150px]">{v.veiculo}</p>
                                                                    </div>
                                                                </div>
                                                                
                                                                <div className="grid grid-cols-2 gap-2 text-xs">
                                                                    <div className="bg-slate-50 p-2 rounded-lg">

                                ) : (
                                    <>
                                        <div><p className="text-[10px] text-slate-500 font-bold uppercase">Veículo</p><p className="font-bold">{veiculoAtual?.veiculo}</p></div>
                                        <div><p className="text-[10px] text-slate-500 font-bold uppercase">Matrícula</p><p className="font-bold">{veiculoAtual?.placa}</p></div>
                                    </>
                                )}
                                <div className="col-span-2 pt-2 border-t border-slate-200 mt-1 flex justify-between">
                                    <p className="text-[10px] text-slate-500 font-bold uppercase">Custo Total Registado</p>
                                    <p className="font-black text-blue-800 text-base">{formatCurrency(totalGasto)}</p>
                                </div>
                            </div>
                        </div>
                        <div className="space-y-4">
                            {despesasFiltradas.map((d, idx) => (
                                <div key={idx} className="break-inside-avoid border-b pb-3 mb-3">
                                    <div className="flex justify-between items-center mb-1">
                                        <h2 className="text-sm font-black uppercase text-slate-800">
                                            #{idx + 1} - {d.categoria} 
                                            {isGlobal && ` [Viatura: ${d.placa}]`}
                                        </h2>
                                        <p className="text-sm font-black">{formatCurrency(d.valor)}</p>
                                    </div>
                                    
                                    <div className="flex justify-between items-center mb-1">
                                        <p className="text-[10px] font-bold text-slate-500">{d.data} • KM: {d.km || 'N/I'}</p>
                                        {d.situacao && <p className="text-[9px] font-bold text-slate-500 uppercase">Estado: {d.situacao}</p>}
                                    </div>

                                    <div className="bg-slate-50 p-2 rounded text-[11px] border border-slate-200">
                                        {d.tipoOS && <p><strong>Intervenção:</strong> {d.tipoOS} | <strong>Local:</strong> {d.localOS}</p>}
                                        <p><strong>Fornecedor:</strong> {d.fornecedor || 'N/A'}</p>
                                        {d.descricao && <p><strong>Descrição:</strong> {d.descricao}</p>}
                                        
                                        {(d.valorMaoObra || d.valorPecas) && (
                                            <div className="border-t border-slate-200 mt-2 pt-1 flex gap-4 text-[10px] text-slate-600">
                                                <span>Mão de Obra: <strong>{d.valorMaoObra ? formatCurrency(d.valorMaoObra) : 'R$ 0,00'}</strong></span>
                                                <span>Peças: <strong>{d.valorPecas ? formatCurrency(d.valorPecas) : 'R$ 0,00'}</strong></span>
                                            </div>
                                        )}
                                    </div>
                                    
                                    {d.anexos && d.anexos.length > 0 && (
                                        <div className="mt-2 flex flex-wrap gap-2 justify-center">
                                            {d.anexos.map((img, i) => <img key={i} src={img} className="max-h-[300px] max-w-[45%] object-contain border border-slate-300 rounded p-1" />)}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ControleFrotaMulti />);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js');
            });
        }
    </script>
</body>
    </html>
