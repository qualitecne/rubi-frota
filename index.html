<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUBI FROTA - Gestão Inteligente</title>
    <!-- Bibliotecas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    
    <style>
        details > summary { list-style: none; cursor: pointer; }
        details > summary::-webkit-details-marker { display: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* ANIMAÇÕES CSS ADICIONADAS */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease forwards; }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // URL DA SUA API GOOGLE SHEETS
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7N4C1lZperjJZiDlk_SPDEl4OlfvuvbjdePeWKa-qr2ojbu4kmL862ntMjjcZNPrPQQ/exec';

        function ControleFrotaMulti() {
            // ESTADOS DA APLICAÇÃO
            const [userRole, setUserRole] = useState(null); 
            const [veiculos, setVeiculos] = useState([]);
            const [veiculoAtivo, setVeiculoAtivo] = useState('TODOS'); 
            const [despesas, setDespesas] = useState([]);
            const [lembretes, setLembretes] = useState([]);
            const [rotas, setRotas] = useState([]);
            
            const [view, setView] = useState('dashboard');
            const [showCadastro, setShowCadastro] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [formError, setFormError] = useState('');
            const [syncStatus, setSyncStatus] = useState('☁️ A conectar...');
            const [editingDespesaIndex, setEditingDespesaIndex] = useState(null);
            
            const [isUploading, setIsUploading] = useState(false);
            const [searchTerm, setSearchTerm] = useState(''); // Estado para a barra de pesquisa

            const [novoVeiculo, setNovoVeiculo] = useState({ veiculo: '', placa: '', motorista: '', centroCusto: '', kmAtual: '' });

            const defaultDespesa = {
                categoria: 'Mecânica / Manutenção', data: new Date().toISOString().split('T')[0], 
                valor: '', valorMaoObra: '', valorPecas: '', situacao: 'Concluída',
                km: '', fornecedor: '', nf: '', descricao: '', pecas: '',
                litros: '', precoLitro: '', // Novos campos de abastecimento
                tipoOS: 'Corretiva', localOS: 'Externa', anexos: []
            };

            const [novaDespesa, setNovaDespesa] = useState(defaultDespesa);

            const [novoLembrete, setNovoLembrete] = useState({
                tipo: 'Troca de Óleo e Filtro', freqKm: '', freqMeses: '', ultimoKm: '', ultimaData: new Date().toISOString().split('T')[0]
            });

            const [novaRotaGestor, setNovaRotaGestor] = useState({ origem: '', destino: '', observacoes: '' });
            const [execucaoRota, setExecucaoRota] = useState(null);

            // CARREGAMENTO INICIAL
            useEffect(() => {
                const savedRole = localStorage.getItem('rubi_frota_role');
                if (savedRole) {
                    setUserRole(savedRole);
                    if (savedRole === 'OPERACIONAL') setView('rotas');
                }
                carregarDaNuvem();
            }, []);

            // VERIFICAÇÃO DE RASCUNHOS
            useEffect(() => {
                if ((view === 'os' || view === 'abastecimento') && editingDespesaIndex === null && veiculoAtivo !== 'TODOS') {
                    const rascunhoStr = localStorage.getItem('rubi_frota_rascunho_despesa');
                    if (rascunhoStr) {
                        const parsed = JSON.parse(rascunhoStr);
                        if (parsed.view === view && parsed.veiculo === veiculoAtivo) setNovaDespesa(parsed.despesa);
                    }
                }
            }, [view, veiculoAtivo, editingDespesaIndex]);

            // FUNÇÕES DE NUVEM E BACKUP
            const carregarDaNuvem = async () => {
                setSyncStatus('⏳ A puxar...');
                try {
                    const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'carregar' }) });
                    const result = await response.json();
                    if (result.status === 'sucesso') {
                        if (result.dados.veiculos) setVeiculos(result.dados.veiculos);
                        if (result.dados.despesas) setDespesas(result.dados.despesas);
                        if (result.dados.lembretes) setLembretes(result.dados.lembretes);
                        if (result.dados.rotas) setRotas(result.dados.rotas);
                        setSyncStatus('☁️ OK');
                        localStorage.setItem('rubi_frota_db', JSON.stringify(result.dados));
                    }
                } catch (error) {
                    setSyncStatus('⚠️ Offline');
                    const saved = localStorage.getItem('rubi_frota_db');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed.veiculos) setVeiculos(parsed.veiculos);
                        if (parsed.despesas) setDespesas(parsed.despesas);
                        if (parsed.lembretes) setLembretes(parsed.lembretes);
                        if (parsed.rotas) setRotas(parsed.rotas);
                    }
                }
            };

            const salvarNaNuvem = async (veics, desps, lembs, rots) => {
                setSyncStatus('⏳ A guardar...');
                localStorage.setItem('rubi_frota_db', JSON.stringify({ veiculos: veics, despesas: desps, lembretes: lembs, rotas: rots }));
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'sincronizar', veiculos: veics, despesas: desps, lembretes: lembs, rotas: rots })
                    });
                    const result = await response.json();
                    if (result.status === 'sucesso') setSyncStatus('☁️ OK');
                    else setSyncStatus('⚠️ Erro Sync');
                } catch (error) {
                    setSyncStatus('⚠️ Offline');
                }
            };

            const exportarBackup = () => {
                const dados = { veiculos, despesas, lembretes, rotas };
                const blob = new Blob([JSON.stringify(dados)], {type: "application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Backup_RUBI_FROTA_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            };

            const importarBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.veiculos) setVeiculos(parsed.veiculos);
                        if (parsed.despesas) setDespesas(parsed.despesas);
                        if (parsed.lembretes) setLembretes(parsed.lembretes);
                        if (parsed.rotas) setRotas(parsed.rotas);
                        salvarNaNuvem(parsed.veiculos || [], parsed.despesas || [], parsed.lembretes || [], parsed.rotas || []);
                        alert("✅ Backup restaurado com sucesso!");
                    } catch(err) {
                        alert("❌ Arquivo de backup inválido!");
                    }
                };
                reader.readAsText(file);
            };

            // ECRÃ DE LOGIN
            if (!userRole) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 p-6 animate-fade-in">
                        <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>
                            <h1 className="text-4xl font-black tracking-tight text-blue-600 mb-1 mt-4">RUBI<span className="text-slate-800 font-light">FROTA</span></h1>
                            <p className="text-slate-500 text-sm mb-10">Selecione o seu perfil de acesso</p>
                            <div className="space-y-4">
                                <button onClick={() => {
                                    const pin = prompt("Digite a senha do Gestor (A senha padrão é 1234):");
                                    if (pin === '1234') { setUserRole('GESTOR'); localStorage.setItem('rubi_frota_role', 'GESTOR'); setView('dashboard'); } 
                                    else if (pin !== null) alert('Senha incorreta!');
                                }} className="w-full bg-slate-800 text-white font-bold p-4 rounded-2xl hover:bg-slate-900 transition flex items-center justify-center gap-3 shadow-md">
                                    <span className="text-2xl">👔</span> <span>Acesso Gestor</span>
                                </button>
                                <button onClick={() => {
                                    setUserRole('OPERACIONAL'); localStorage.setItem('rubi_frota_role', 'OPERACIONAL'); setView('rotas');
                                }} className="w-full bg-blue-50 text-blue-700 font-bold p-4 rounded-2xl border border-blue-200 hover:bg-blue-100 transition flex items-center justify-center gap-3">
                                    <span className="text-2xl">🚛</span> <span>Acesso Operacional</span>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // VARIÁVEIS COMPUTADAS E FILTROS
            const isGlobal = veiculoAtivo === 'TODOS';
            const veiculoAtual = isGlobal ? null : veiculos.find(v => v.placa === veiculoAtivo);
            const kmAtualNum = veiculoAtual ? parseFloat(veiculoAtual.kmAtual) || 0 : 0;
            
            const despesasIniciais = isGlobal ? despesas.slice().reverse() : despesas.filter(d => d.placa === veiculoAtivo).reverse();
            
            // Barra de Pesquisa Aplicada ao Histórico
            const despesasFiltradas = despesasIniciais.filter(d => 
                (d.categoria && d.categoria.toLowerCase().includes(searchTerm.toLowerCase())) || 
                (d.fornecedor && d.fornecedor.toLowerCase().includes(searchTerm.toLowerCase())) ||
                (d.descricao && d.descricao.toLowerCase().includes(searchTerm.toLowerCase())) ||
                (d.placa && d.placa.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            const lembretesFiltrados = isGlobal ? lembretes : lembretes.filter(l => l.placa === veiculoAtivo);
            const rotasFiltradas = isGlobal ? rotas.slice().reverse() : rotas.filter(r => r.placa === veiculoAtivo).reverse();
            const totalGasto = despesasIniciais.reduce((acc, curr) => acc + (parseFloat(curr.valor) || 0), 0);

            const formatCurrency = (val) => isNaN(parseFloat(val)) ? 'R$ 0,00' : parseFloat(val).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            const getKmAtual = (placa) => {
                const v = veiculos.find(ve => ve.placa === placa);
                return v ? parseFloat(v.kmAtual) || 0 : 0;
            };

            const atualizarKmVeiculo = (novoKmInformado, placaVeiculo) => {
                const novoKm = parseFloat(novoKmInformado);
                const veiculoAlvo = veiculos.find(v => v.placa === placaVeiculo);
                if (veiculoAlvo && novoKm > (parseFloat(veiculoAlvo.kmAtual) || 0)) {
                    return veiculos.map(v => v.placa === placaVeiculo ? { ...v, kmAtual: novoKm } : v);
                }
                return veiculos;
            };

            // FUNÇÕES DE AÇÃO
            const handleAddVeiculo = () => {
                if (!novoVeiculo.veiculo || !novoVeiculo.placa) return alert('Veículo e Matrícula/Placa são obrigatórios!');
                const placaUpper = novoVeiculo.placa.toUpperCase();
                if (veiculos.find(v => v.placa === placaUpper)) return alert('Matrícula já registada!');
                const novosVeiculos = [...veiculos, { ...novoVeiculo, placa: placaUpper }];
                setVeiculos(novosVeiculos);
                salvarNaNuvem(novosVeiculos, despesas, lembretes, rotas);
                setVeiculoAtivo(placaUpper);
                setNovoVeiculo({ veiculo: '', placa: '', motorista: '', centroCusto: '', kmAtual: '' });
                setShowCadastro(false);
                setView('dashboard');
            };

            const removerVeiculo = () => {
                if(confirm("ATENÇÃO: Deseja excluir esta viatura permanentemente?")) {
                    const novosVeiculos = veiculos.filter(v => v.placa !== veiculoAtivo);
                    setVeiculos(novosVeiculos);
                    salvarNaNuvem(novosVeiculos, despesas, lembretes, rotas);
                    setVeiculoAtivo('TODOS');
                    setView('dashboard');
                }
            };

            const handleSalvarRascunhoDespesa = () => {
                localStorage.setItem('rubi_frota_rascunho_despesa', JSON.stringify({ view: view, veiculo: veiculoAtivo, despesa: novaDespesa }));
                alert('💾 Rascunho salvo com sucesso!');
            };

            const handleAddDespesa = () => {
                if (isGlobal) return alert('Selecione uma viatura específica.');
                let valorFinal = novaDespesa.valor;
                
                // Tratamento inteligente da Descrição do Abastecimento
                let descricaoFinal = novaDespesa.descricao;
                if (view === 'abastecimento') {
                    if (novaDespesa.litros && novaDespesa.precoLitro) {
                        const resumo = `[${novaDespesa.litros}L a R$${novaDespesa.precoLitro}/L]`;
                        descricaoFinal = descricaoFinal ? `${resumo} ${descricaoFinal}` : resumo;
                    }
                }

                if (view === 'os') {
                    const totalOS = (parseFloat(novaDespesa.valorMaoObra) || 0) + (parseFloat(novaDespesa.valorPecas) || 0);
                    if (totalOS <= 0 && novaDespesa.situacao === 'Concluída' && userRole === 'GESTOR') return setFormError('Informe os valores para O.S. Concluída.');
                    valorFinal = totalOS > 0 ? totalOS.toFixed(2) : '0.00';
                }
                
                if (!novaDespesa.data) return setFormError('A data é obrigatória.');
                setFormError('');

                let novosVeiculos = veiculos;
                if (novaDespesa.km) {
                    novosVeiculos = atualizarKmVeiculo(novaDespesa.km, veiculoAtivo);
                    setVeiculos(novosVeiculos);
                }

                let novasDespesas = [...despesas];
                const registoPronto = { ...novaDespesa, valor: valorFinal, descricao: descricaoFinal, placa: veiculoAtivo };
                
                if (editingDespesaIndex !== null) {
                    novasDespesas[editingDespesaIndex] = registoPronto;
                    alert('✅ Registo atualizado!');
                } else {
                    novasDespesas = [...despesas, registoPronto];
                    alert('✅ Registo guardado com sucesso!');
                }

                setDespesas(novasDespesas);
                salvarNaNuvem(novosVeiculos, novasDespesas, lembretes, rotas);
                localStorage.removeItem('rubi_frota_rascunho_despesa');
                setEditingDespesaIndex(null);
                setNovaDespesa(defaultDespesa);
                if(userRole === 'GESTOR') setView('historico');
            };

            const handleEditDespesa = (despesa) => {
                const indexReal = despesas.indexOf(despesa);
                setEditingDespesaIndex(indexReal);
                setNovaDespesa(despesa);
                setView(despesa.categoria === 'Abastecimento' ? 'abastecimento' : 'os');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const removerDespesa = (despesa) => {
                if(confirm("Deseja eliminar este registo?")) {
                    const novasDespesas = despesas.filter(d => d !== despesa);
                    setDespesas(novasDespesas);
                    salvarNaNuvem(veiculos, novasDespesas, lembretes, rotas);
                }
            };

            // UPLOAD PARA O GOOGLE DRIVE (AGORA SUPORTA PDF)
            const handleImageUpload = async (e) => {
                const arquivos = Array.from(e.target.files);
                if (arquivos.length === 0) return;
                setIsUploading(true);
                setFormError('');

                const uploadPromises = arquivos.map(file => {
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = event => {
                            const isPDF = file.type === 'application/pdf';
                            
                            if (isPDF) {
                                // PDF: Envia base64 direto
                                const base64Data = event.target.result;
                                fetch(SCRIPT_URL, {
                                    method: 'POST',
                                    body: JSON.stringify({ action: 'upload_imagem', base64: base64Data, nomeArquivo: `DOC_${Date.now()}.pdf`, mimeType: 'application/pdf' })
                                }).then(res => res.json()).then(result => {
                                    if (result.status === 'sucesso') resolve(result.url); else reject();
                                }).catch(() => reject());
                            } else {
                                // IMAGEM: Comprime via Canvas
                                const img = new Image();
                                img.onload = async () => {
                                    const canvas = document.createElement('canvas');
                                    const ctx = canvas.getContext('2d');
                                    let w = img.width, h = img.height;
                                    if (w > 1200) { h *= 1200 / w; w = 1200; }
                                    canvas.width = w; canvas.height = h;
                                    ctx.drawImage(img, 0, 0, w, h);
                                    const base64Data = canvas.toDataURL('image/jpeg', 0.7);
                                    fetch(SCRIPT_URL, {
                                        method: 'POST',
                                        body: JSON.stringify({ action: 'upload_imagem', base64: base64Data, nomeArquivo: `FOTO_${Date.now()}.jpg`, mimeType: 'image/jpeg' })
                                    }).then(res => res.json()).then(result => {
                                        if (result.status === 'sucesso') resolve(result.url); else reject();
                                    }).catch(() => reject());
                                };
                                img.src = event.target.result;
                            }
                        };
                        reader.readAsDataURL(file);
                    });
                });

                try {
                    const uploadedUrls = await Promise.all(uploadPromises);
                    setNovaDespesa(prev => ({ ...prev, anexos: [...(prev.anexos || []), ...uploadedUrls] }));
                } catch (err) {
                    setFormError('Erro ao carregar ficheiro. Tente novamente.');
                } finally {
                    setIsUploading(false);
                }
            };

            return (
                <div className="min-h-screen font-sans text-slate-800 pb-24 md:pb-10 max-w-md md:max-w-4xl mx-auto md:mt-4 shadow-xl bg-white md:rounded-3xl overflow-hidden relative border border-slate-200">
                    
                    <div id="main-ui">
                        {/* CABEÇALHO */}
                        <div className="bg-slate-900 text-white p-5 rounded-b-3xl md:rounded-t-3xl md:rounded-b-none shadow-md">
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex items-center gap-3">
                                    <h1 className="text-xl font-black tracking-tight text-blue-400">RUBI<span className="text-white font-light">FROTA</span></h1>
                                    <button onClick={carregarDaNuvem} className="bg-slate-800 border border-slate-700 text-[9px] font-bold px-2 py-1 rounded-lg text-slate-300">
                                        {syncStatus}
                                    </button>
                                </div>
                                <div className="flex gap-2">
                                    {userRole === 'GESTOR' && (
                                        <button onClick={() => setShowCadastro(!showCadastro)} className="bg-blue-600 hover:bg-blue-500 text-[10px] px-3 py-1.5 rounded-full font-bold">
                                            {showCadastro ? 'Cancelar' : '+ Veículo'}
                                        </button>
                                    )}
                                    <button onClick={() => { if(confirm("Deseja sair da sua conta?")) { setUserRole(null); localStorage.removeItem('rubi_frota_role'); setView('dashboard'); } }} className="bg-red-500 hover:bg-red-600 text-[10px] font-bold px-3 py-1.5 rounded-full">Sair</button>
                                </div>
                            </div>
                            
                            {!showCadastro && veiculos.length > 0 && (
                                <div className="bg-slate-800 rounded-2xl p-2 flex items-center border border-slate-700">
                                    <span className="pl-3 text-slate-400 text-xl">{isGlobal ? '🌐' : '🚘'}</span>
                                    <select className="w-full p-2 bg-transparent text-white font-bold outline-none appearance-none" 
                                            value={veiculoAtivo} onChange={e => { 
                                                setVeiculoAtivo(e.target.value); setExecucaoRota(null);
                                                if (userRole === 'GESTOR') setView('dashboard');
                                            }}>
                                        {userRole === 'GESTOR' && <option value="TODOS" className="text-slate-900 font-bold bg-slate-100">🌐 VISÃO GLOBAL (Toda a Frota)</option>}
                                        {userRole === 'OPERACIONAL' && <option value="TODOS" className="text-slate-900 font-bold bg-slate-100">-- Selecione a Viatura --</option>}
                                        {veiculos.map((v, i) => <option key={i} value={v.placa} className="text-slate-900">{v.placa} - {v.veiculo}</option>)}
                                    </select>
                                </div>
                            )}
                        </div>

                        {/* CADASTRO DE VEÍCULO (SÓ GESTOR) */}
                        {showCadastro && userRole === 'GESTOR' && (
                            <div className="p-5 animate-fade-in space-y-4">
                                <h2 className="font-bold text-lg text-slate-800">Registar Novo Veículo</h2>
                                <input className="w-full border p-3 rounded-xl outline-none" placeholder="Marca / Modelo" value={novoVeiculo.veiculo} onChange={e => setNovoVeiculo({...novoVeiculo, veiculo: e.target.value})} />
                                <input className="w-full border p-3 rounded-xl outline-none uppercase" placeholder="Matrícula / Placa" value={novoVeiculo.placa} onChange={e => setNovoVeiculo({...novoVeiculo, placa: e.target.value})} />
                                <input type="number" className="w-full border p-3 rounded-xl outline-none" placeholder="KM Inicial (Odómetro)" value={novoVeiculo.kmAtual} onChange={e => setNovoVeiculo({...novoVeiculo, kmAtual: e.target.value})} />
                                <div className="grid grid-cols-2 gap-2">
                                    <input className="w-full border p-3 rounded-xl outline-none" placeholder="Motorista" value={novoVeiculo.motorista} onChange={e => setNovoVeiculo({...novoVeiculo, motorista: e.target.value})} />
                                    <input className="w-full border p-3 rounded-xl outline-none" placeholder="Centro de Custo" value={novoVeiculo.centroCusto} onChange={e => setNovoVeiculo({...novoVeiculo, centroCusto: e.target.value})} />
                                </div>
                                <button onClick={handleAddVeiculo} className="w-full bg-blue-700 text-white font-bold p-4 rounded-xl shadow-lg">Guardar Veículo</button>
                            </div>
                        )}

                        {/* BLOQUEIOS DE ACESSO */}
                        {!showCadastro && isGlobal && veiculos.length > 0 && userRole === 'GESTOR' && (view === 'rotas' || view === 'os' || view === 'abastecimento' || view === 'lembretes') && (
                            <div className="p-10 text-center text-slate-500 animate-fade-in mt-10">
                                <span className="text-5xl block mb-4 opacity-50">🔒</span>
                                <h2 className="font-bold text-xl text-slate-700 mb-2">Ação Não Permitida</h2>
                                <p className="text-sm">Selecione uma viatura específica no menu superior para aceder a esta aba.</p>
                            </div>
                        )}

                        {/* CONTEÚDO PRINCIPAL */}
                        {!showCadastro && veiculos.length > 0 && (!isGlobal || (isGlobal && userRole === 'GESTOR' && (view === 'dashboard' || view === 'historico'))) && (
                            <div className="p-4 space-y-4 mb-16">
                                
                                {/* 1. DASHBOARD COMPLETO */}
                                {view === 'dashboard' && userRole === 'GESTOR' && (
                                    <div className="animate-fade-in space-y-4">
                                        
                                        {/* Ações de Backup na Visão Global */}
                                        {isGlobal && (
                                            <div className="flex justify-between items-center bg-slate-50 border border-slate-200 p-2 rounded-xl">
                                                <span className="text-[10px] font-bold text-slate-500 px-2">SEGURANÇA (JSON)</span>
                                                <div className="flex gap-2">
                                                    <button onClick={exportarBackup} className="bg-white border border-slate-300 text-slate-700 text-[10px] font-bold px-3 py-1.5 rounded-lg shadow-sm">📥 Exportar</button>
                                                    <label className="bg-white border border-slate-300 text-slate-700 text-[10px] font-bold px-3 py-1.5 rounded-lg shadow-sm cursor-pointer">
                                                        📤 Importar <input type="file" accept=".json" className="hidden" onChange={importarBackup} />
                                                    </label>
                                                </div>
                                            </div>
                                        )}

                                        <div className="bg-slate-800 text-white p-4 rounded-2xl shadow-sm flex flex-col gap-3">
                                            <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                                                <div>
                                                    <h2 className="font-bold text-lg">{isGlobal ? 'Visão Global da Empresa' : veiculoAtual.veiculo}</h2>
                                                    <p className="text-xs text-slate-400">{isGlobal ? `${veiculos.length} veículos ativos` : `C. Custo: ${veiculoAtual.centroCusto || 'N/I'} | Motorista: ${veiculoAtual.motorista || 'N/I'}`}</p>
                                                </div>
                                                <span className="text-3xl">{isGlobal ? '🏢' : '🚘'}</span>
                                            </div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <div>
                                                    <p className="text-[10px] text-slate-400 font-bold uppercase mb-0.5">Custo Total</p>
                                                    <p className="text-xl font-black text-blue-400">{formatCurrency(totalGasto)}</p>
                                                </div>
                                                <div>
                                                    <p className="text-[10px] text-slate-400 font-bold uppercase mb-0.5">{isGlobal ? 'Intervenções' : 'KM Atual'}</p>
                                                    <p className="text-xl font-black text-white">{isGlobal ? `${despesasIniciais.length} Registros` : kmAtualNum.toLocaleString()}</p>
                                                </div>
                                            </div>
                                        </div>

                                        {isGlobal ? (
                                            <div className="mt-6">
                                                <h3 className="font-bold text-slate-700 text-sm mb-3">Painel da Frota</h3>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                    {veiculos.map(v => {
                                                        const despVeiculo = despesas.filter(d => d.placa === v.placa);
                                                        const totalVeiculo = despVeiculo.reduce((acc, curr) => acc + (parseFloat(curr.valor) || 0), 0);
                                                        const custoPorKm = (parseFloat(v.kmAtual) > 0) ? (totalVeiculo / parseFloat(v.kmAtual)).toFixed(2) : 0;
                                                        
                                                        let indicadorCor = 'bg-green-500'; // Simplificado para exibição direta
                                                        return (
                                                            <div key={v.placa} className="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 cursor-pointer hover:border-blue-400 transition relative" onClick={() => { setVeiculoAtivo(v.placa); setView('dashboard'); }}>
                                                                <div className={`absolute top-3 right-3 w-3 h-3 rounded-full ${indicadorCor} shadow-sm border border-white`}></div>
                                                                <div className="flex items-center gap-3 mb-3 border-b border-slate-100 pb-2">
                                                                    <div className="bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center text-xl">🚘</div>
                                                                    <div>
                                                                        <h4 className="font-black text-slate-800 text-sm uppercase leading-tight">{v.placa}</h4>
                                                                        <p className="text-[10px] text-slate-500 font-bold uppercase truncate max-w-[150px]">{v.veiculo}</p>
                                                                    </div>
                                                                </div>
                                                                <div className="grid grid-cols-2 gap-2 text-xs">
                                                                    <div className="bg-slate-50 p-2 rounded-lg">
                                                                        <p className="text-[9px] font-bold text-slate-400 uppercase">Custo / KM</p>
                                                                        <p className="font-black text-slate-700">R$ {custoPorKm}</p>
                                                                    </div>
                                                                    <div className="bg-slate-50 p-2 rounded-lg">
                                                                        <p className="text-[9px] font-bold text-slate-400 uppercase">Gasto Total</p>
                                                                        <p className="font-black text-blue-700">{formatCurrency(totalVeiculo)}</p>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        )
                                                    })}
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="space-y-4">
                                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                                    <div className="bg-slate-50 p-3 border-b border-slate-200 flex justify-between items-center">
                                                        <h3 className="font-bold text-slate-700 text-sm">Estado da Manutenção</h3>
                                                    </div>
                                                    <div className="p-3 space-y-2">
                                                        {lembretesFiltrados.length === 0 ? <p className="text-xs text-slate-400 text-center py-2">Nenhum alerta configurado.</p> : (
                                                            lembretesFiltrados.map((l, i) => (
                                                                <div key={i} className="flex items-center justify-between p-2 rounded-xl border-l-4 shadow-sm bg-slate-50 border-slate-300">
                                                                    <div className="flex items-center gap-2">
                                                                        <span className="text-lg">📅</span>
                                                                        <div>
                                                                            <p className="text-sm font-bold leading-tight">{l.tipo}</p>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            ))
                                                        )}
                                                    </div>
                                                </div>
                                                
                                                {/* Botão de Excluir Veículo Individual */}
                                                <button onClick={removerVeiculo} className="w-full border border-red-200 text-red-500 font-bold p-3 rounded-xl text-sm shadow-sm hover:bg-red-50 transition">
                                                    🗑️ Excluir Viatura Permanentemente
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* 2. ABASTECIMENTO (AGORA COM LITROS E PREÇO) */}
                                {view === 'abastecimento' && !isGlobal && userRole === 'GESTOR' && (
                                    <div className="bg-white p-1 animate-fade-in">
                                        <div className="flex justify-between items-center mb-4">
                                            <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                                {editingDespesaIndex !== null ? '✏️ Editar Abastecimento' : '⛽ Novo Abastecimento'}
                                            </h2>
                                            {editingDespesaIndex !== null && (
                                                <button onClick={() => { setEditingDespesaIndex(null); setNovaDespesa(defaultDespesa); setView('historico'); }} className="text-xs bg-slate-200 text-slate-600 px-3 py-1 rounded-full font-bold">Cancelar</button>
                                            )}
                                        </div>
                                        <div className="space-y-3">
                                            <div className="grid grid-cols-2 gap-2">
                                                <input type="date" className="w-full border p-3 rounded-xl bg-slate-50" value={novaDespesa.data} onChange={e => setNovaDespesa({...novaDespesa, data: e.target.value})} />
                                                <input type="number" className="w-full border p-3 rounded-xl" placeholder={`KM Bomba (Atual: ${kmAtualNum})`} value={novaDespesa.km} onChange={e => setNovaDespesa({...novaDespesa, km: e.target.value})} />
                                            </div>
                                            <input className="w-full border p-3 rounded-xl" placeholder="Posto / Fornecedor" value={novaDespesa.fornecedor} onChange={e => setNovaDespesa({...novaDespesa, fornecedor: e.target.value})} />
                                            
                                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
                                                <h3 className="text-xs font-bold text-slate-500 uppercase">Detalhes do Combustível</h3>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <input type="number" step="0.01" className="w-full border p-2 rounded-lg text-sm bg-white" placeholder="Qtd. Litros" value={novaDespesa.litros} onChange={e => {
                                                        const l = e.target.value; const p = novaDespesa.precoLitro;
                                                        setNovaDespesa({...novaDespesa, litros: l, valor: (p && l) ? (parseFloat(p)*parseFloat(l)).toFixed(2) : novaDespesa.valor});
                                                    }} />
                                                    <input type="number" step="0.01" className="w-full border p-2 rounded-lg text-sm bg-white" placeholder="Preço p/ Litro (R$)" value={novaDespesa.precoLitro} onChange={e => {
                                                        const p = e.target.value; const l = novaDespesa.litros;
                                                        setNovaDespesa({...novaDespesa, precoLitro: p, valor: (p && l) ? (parseFloat(p)*parseFloat(l)).toFixed(2) : novaDespesa.valor});
                                                    }} />
                                                </div>
                                            </div>

                                            <input type="number" className="w-full border p-3 rounded-xl font-bold text-blue-700 text-lg" placeholder="Valor Total da Nota (R$)" value={novaDespesa.valor} onChange={e => setNovaDespesa({...novaDespesa, valor: e.target.value})} />
                                            <textarea rows="2" className="w-full border p-3 rounded-xl outline-none" placeholder="Observações (Opcional)..." value={novaDespesa.descricao} onChange={e => setNovaDespesa({...novaDespesa, descricao: e.target.value})}></textarea>
                                            
                                            <label className={`block bg-slate-50 border border-dashed p-4 rounded-xl text-center cursor-pointer ${isUploading ? 'border-amber-400 bg-amber-50' : 'border-slate-300'}`}>
                                                <span className={`text-sm font-bold ${isUploading ? 'text-amber-600' : 'text-slate-600'}`}>
                                                    {isUploading ? '⏳ A carregar para a nuvem...' : '📸 Anexar Foto ou PDF do Cupom'}
                                                </span>
                                                <input type="file" accept="image/*,application/pdf" className="hidden" disabled={isUploading} onChange={handleImageUpload} />
                                            </label>
                                            
                                            {novaDespesa.anexos.length > 0 && <p className="text-xs font-bold text-green-600 text-center">{novaDespesa.anexos.length} ficheiro(s) anexado(s).</p>}
                                            {formError && <p className="text-red-500 font-bold text-sm text-center">{formError}</p>}
                                            
                                            <div className="flex gap-2 pt-2 border-t border-slate-100">
                                                <button onClick={handleSalvarRascunhoDespesa} disabled={isUploading} className="w-1/2 bg-slate-100 border border-slate-300 text-slate-600 font-bold p-3 rounded-xl text-sm">💾 Salvar Rascunho</button>
                                                <button onClick={handleAddDespesa} disabled={isUploading} className={`w-1/2 text-white font-bold p-3 rounded-xl shadow-lg transition text-sm ${isUploading ? 'bg-slate-400 cursor-not-allowed' : 'bg-blue-700 hover:bg-blue-800'}`}>
                                                    {isUploading ? 'Aguarde...' : editingDespesaIndex !== null ? 'Atualizar' : '✅ Concluir'}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* 3. O.S. (GESTOR / OPERACIONAL) */}
                                {view === 'os' && !isGlobal && (
                                    <div className="bg-white p-1 animate-fade-in">
                                        <div className="flex justify-between items-center mb-4">
                                            <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                                {editingDespesaIndex !== null ? '✏️ Editar Ordem de Serviço' : '🔧 Nova Ordem de Serviço'}
                                            </h2>
                                            {editingDespesaIndex !== null && (
                                                <button onClick={() => { setEditingDespesaIndex(null); setNovaDespesa(defaultDespesa); setView('historico'); }} className="text-xs bg-slate-200 text-slate-600 px-3 py-1 rounded-full font-bold">Cancelar</button>
                                            )}
                                        </div>
                                        
                                        <div className="space-y-3">
                                            <select className="w-full bg-slate-50 p-3 rounded-xl font-bold text-slate-700 border outline-none" value={novaDespesa.categoria} onChange={e => setNovaDespesa({...novaDespesa, categoria: e.target.value})}>
                                                <option value="Mecânica / Manutenção">Manutenção Mecânica</option>
                                                <option value="Troca de Óleo / Filtros">Troca de Óleo / Filtros</option>
                                                <option value="Pneus / Borracharia">Pneus / Borracharia</option>
                                                <option value="Lavagem / Estética">Lavagem / Estética</option>
                                                <option value="Documentação / Seguro">Documentação / Seguro / IPVA</option>
                                            </select>
                                            
                                            <div className="grid grid-cols-3 gap-2">
                                                <select className="w-full border p-2 rounded-xl text-xs font-semibold" value={novaDespesa.tipoOS} onChange={e=>setNovaDespesa({...novaDespesa, tipoOS: e.target.value})}><option value="Corretiva">Corretiva</option><option value="Preventiva">Preventiva</option></select>
                                                <select className="w-full border p-2 rounded-xl text-xs font-semibold" value={novaDespesa.localOS} onChange={e=>setNovaDespesa({...novaDespesa, localOS: e.target.value})}><option value="Externa">Externa</option><option value="Interna">Interna</option></select>
                                                <select className="w-full border p-2 rounded-xl text-xs font-semibold bg-slate-100" value={novaDespesa.situacao} onChange={e=>setNovaDespesa({...novaDespesa, situacao: e.target.value})}><option value="Orçamento">📝 Orçamento</option><option value="Em Andamento">⏳ Andamento</option><option value="Concluída">✅ Concluída</option></select>
                                            </div>

                                            <div className="grid grid-cols-2 gap-2">
                                                <input type="date" className="w-full border p-3 rounded-xl bg-slate-50" value={novaDespesa.data} onChange={e => setNovaDespesa({...novaDespesa, data: e.target.value})} />
                                                <input type="number" className="w-full border p-3 rounded-xl" placeholder={`KM Atual: ${kmAtualNum}`} value={novaDespesa.km} onChange={e => setNovaDespesa({...novaDespesa, km: e.target.value})} />
                                            </div>
                                            
                                            <input className="w-full border p-3 rounded-xl" placeholder="Oficina / Fornecedor" value={novaDespesa.fornecedor} onChange={e => setNovaDespesa({...novaDespesa, fornecedor: e.target.value})} />
                                            <textarea rows="2" className="w-full border p-3 rounded-xl outline-none" placeholder="Descrição do Serviço realizado..." value={novaDespesa.descricao} onChange={e => setNovaDespesa({...novaDespesa, descricao: e.target.value})}></textarea>
                                            
                                            <div className="bg-slate-50 border border-slate-200 p-3 rounded-xl mt-2">
                                                <h3 className="text-xs font-bold text-slate-500 uppercase mb-2">💳 Valores Financeiros</h3>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <input type="number" className="w-full border p-2 rounded-lg text-sm bg-white" placeholder="Mão de Obra (R$)" value={novaDespesa.valorMaoObra} onChange={e=>setNovaDespesa({...novaDespesa, valorMaoObra: e.target.value})} />
                                                    <input type="number" className="w-full border p-2 rounded-lg text-sm bg-white" placeholder="Peças (R$)" value={novaDespesa.valorPecas} onChange={e=>setNovaDespesa({...novaDespesa, valorPecas: e.target.value})} />
                                                </div>
                                                <div className="mt-3 text-right border-t border-slate-200 pt-2 flex justify-between items-center">
                                                    <span className="text-xs font-bold text-slate-500 uppercase">Total da O.S.</span>
                                                    <span className="text-xl font-black text-blue-700">
                                                        {formatCurrency((parseFloat(novaDespesa.valorMaoObra) || 0) + (parseFloat(novaDespesa.valorPecas) || 0))}
                                                    </span>
                                                </div>
                                            </div>
                                            
                                            <label className={`block bg-slate-50 border border-dashed p-4 rounded-xl text-center cursor-pointer ${isUploading ? 'border-amber-400 bg-amber-50' : 'border-slate-300'}`}>
                                                <span className={`text-sm font-bold ${isUploading ? 'text-amber-600' : 'text-slate-600'}`}>
                                                    {isUploading ? '⏳ A carregar para a nuvem...' : '📸 Anexar O.S. (Foto ou PDF)'}
                                                </span>
                                                <input type="file" accept="image/*,application/pdf" multiple className="hidden" disabled={isUploading} onChange={handleImageUpload} />
                                            </label>

                                            {formError && <p className="text-red-500 font-bold text-sm text-center">{formError}</p>}
                                            
                                            <div className="flex gap-2 pt-2 border-t border-slate-100">
                                                <button onClick={handleSalvarRascunhoDespesa} disabled={isUploading} className="w-1/2 bg-slate-100 border border-slate-300 text-slate-600 font-bold p-3 rounded-xl text-sm">💾 Salvar Rascunho</button>
                                                <button onClick={handleAddDespesa} disabled={isUploading} className={`w-1/2 text-white font-bold p-3 rounded-xl shadow-lg transition text-sm ${isUploading ? 'bg-slate-400 cursor-not-allowed' : 'bg-slate-800 hover:bg-slate-900'}`}>
                                                    {isUploading ? 'Aguarde...' : editingDespesaIndex !== null ? 'Atualizar' : '✅ Concluir'}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* 4. HISTÓRICO COM PESQUISA (SÓ GESTOR) */}
                                {view === 'historico' && userRole === 'GESTOR' && (
                                    <div className="animate-fade-in space-y-4">
                                        <div className="flex justify-between items-center">
                                            <h2 className="text-xl font-bold text-slate-800">🧾 Histórico da Frota</h2>
                                        </div>

                                        {/* Barra de Pesquisa */}
                                        <div className="relative">
                                            <span className="absolute left-3 top-3 text-slate-400">🔍</span>
                                            <input type="text" className="w-full bg-white border border-slate-300 rounded-xl py-3 pl-10 pr-4 text-sm font-bold shadow-sm outline-none focus:border-blue-500" placeholder="Pesquisar categoria, fornecedor ou descrição..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                                        </div>

                                        {despesasFiltradas.length === 0 ? <p className="text-center text-slate-400 py-10">Nenhum registo encontrado.</p> : (
                                            despesasFiltradas.map((d, i) => (
                                                <div key={i} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                                                    <div className="flex justify-between items-start mb-2 border-b border-slate-100 pb-2">
                                                        <div>
                                                            <span className="font-bold text-slate-800 uppercase block text-sm flex items-center gap-2">
                                                                {d.categoria} {isGlobal && <span className="bg-blue-100 text-blue-800 text-[10px] px-2 py-0.5 rounded font-black">{d.placa}</span>}
                                                            </span>
                                                            <span className="text-xs text-slate-500">{d.data} • KM: {d.km || '-'}</span>
                                                        </div>
                                                        <div className="text-right">
                                                            <span className="text-lg font-black text-blue-700 block">{formatCurrency(d.valor)}</span>
                                                            {d.situacao && <span className={`text-[9px] px-1.5 py-0.5 rounded font-bold uppercase mt-1 inline-block ${d.situacao==='Orçamento'?'bg-amber-100 text-amber-800':d.situacao==='Em Andamento'?'bg-blue-100 text-blue-800':'bg-green-100 text-green-800'}`}>{d.situacao}</span>}
                                                        </div>
                                                    </div>
                                                    <div className="text-sm text-slate-600 leading-tight space-y-1">
                                                        {d.fornecedor && <p>🏢 <strong>{d.fornecedor}</strong></p>}
                                                        {d.descricao && <p>🔧 {d.descricao}</p>}
                                                    </div>
                                                    <div className="flex justify-between items-center mt-3 pt-2 border-t border-slate-100">
                                                        {d.anexos && d.anexos.length > 0 ? (
                                                            <details className="text-sm w-full">
                                                                <summary className="text-blue-700 font-bold bg-blue-50 px-3 py-1 rounded-lg border border-blue-100 inline-block">📸 Ver {d.anexos.length} Anexo(s) ▾</summary>
                                                                <div className="flex flex-col gap-2 mt-2 p-2 bg-slate-50 rounded-lg border border-slate-200">
                                                                    {d.anexos.map((url, idx) => (
                                                                        <a key={idx} href={url} target="_blank" className="text-blue-600 underline text-xs break-all">🔗 Abrir Anexo {idx+1}</a>
                                                                    ))}
                                                                </div>
                                                            </details>
                                                        ) : <div className="text-xs text-slate-300 w-full">Sem anexos</div>}
                                                        
                                                        <div className="flex gap-4">
                                                            <button onClick={() => handleEditDespesa(d)} className="text-amber-600 text-xs font-bold underline whitespace-nowrap">Editar</button>
                                                            <button onClick={() => removerDespesa(d)} className="text-red-500 text-xs font-bold underline whitespace-nowrap">Excluir</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                        
                        {/* MENU INFERIOR */}
                        {!showCadastro && veiculos.length > 0 && (
                            <div className="fixed md:absolute bottom-0 left-0 w-full bg-white border-t border-slate-200 px-1 py-2 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-50 overflow-x-auto hide-scroll">
                                {userRole === 'GESTOR' ? (
                                    <div className="flex justify-between items-center min-w-full gap-1">
                                        <button onClick={() => { setView('dashboard'); setEditingDespesaIndex(null); }} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'dashboard' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">🏠</span><span className="text-[9px] font-bold uppercase">Painel</span>
                                        </button>
                                        <button onClick={() => { setView('abastecimento'); if(editingDespesaIndex === null) setNovaDespesa({...defaultDespesa, categoria: 'Abastecimento'}); }} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'abastecimento' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">⛽</span><span className="text-[9px] font-bold uppercase">Posto</span>
                                        </button>
                                        <button onClick={() => { setView('os'); if(editingDespesaIndex === null) setNovaDespesa({...defaultDespesa, categoria: 'Mecânica / Manutenção'}); }} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'os' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">🔧</span><span className="text-[9px] font-bold uppercase">O.S.</span>
                                        </button>
                                        <button onClick={() => { setView('historico'); setEditingDespesaIndex(null); }} className={`flex-1 flex flex-col items-center justify-center p-1 rounded-xl transition-colors ${view === 'historico' ? 'text-blue-700 bg-blue-50' : 'text-slate-400'}`}>
                                            <span className="text-xl mb-0.5">🧾</span><span className="text-[9px] font-bold uppercase">Histórico</span>
                                        </button>
                                    </div>
                                ) : (
                                    <div className="flex justify-center items-center min-w-full gap-2 px-2">
                                        <button onClick={() => { setView('os'); setNovaDespesa({...defaultDespesa, categoria: 'Mecânica / Manutenção'}); }} className={`w-full flex flex-col items-center justify-center p-2 rounded-xl transition-colors border ${view === 'os' ? 'text-blue-700 bg-blue-50 border-blue-200' : 'text-slate-500 border-transparent'}`}>
                                            <span className="text-2xl mb-1">🔧</span><span className="text-xs font-bold uppercase">Registar O.S.</span>
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ControleFrotaMulti />);
    </script>
